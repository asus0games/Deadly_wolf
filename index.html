<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadly_wolf</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#660000;
  --accent2:#320b35;
  --bg:#0a0a0f;
  --panel:#121218;
  --line:#2a2a35;
  --text:#e8e8ef;
  --muted:#9a9aa8;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
}
/* фоновое свечение и сетка */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%),
    radial-gradient(ellipse 60% 50% at 90% 100%, color-mix(in srgb, var(--accent2) 45%, transparent), transparent 70%),
    linear-gradient(transparent 95%, rgba(255,255,255,.03) 95%) 0 0/100% 28px,
    linear-gradient(90deg, transparent 95%, rgba(255,255,255,.03) 95%) 0 0/28px 100%;
}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

/* шапка */
header{
  border-bottom:2px solid var(--accent);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 24px) 100%,0 100%);
  background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.15));
  position:sticky;top:0;z-index:50;backdrop-filter:blur(6px);
}
.head-in{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.logo img{width:44px;height:44px;border-radius:8px;border:2px solid var(--accent)}
.logo b{font-size:22px;letter-spacing:2px;text-transform:uppercase}
.logo small{display:block;color:var(--muted);font-size:13px;letter-spacing:.5px}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav a{
  color:var(--muted);text-decoration:none;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;font-size:14px;padding:8px 14px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
nav a:hover,nav a.active{color:var(--text);background:rgba(255,255,255,.06)}

/* плашка черновика */
.draft-bar{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:#3a2f00;border:1px solid #b98900;color:#ffe9a8;
  padding:10px 16px;font-size:14px;margin:14px auto 0;
}
.draft-bar button{
  background:#b98900;color:#1a1400;border:0;font-family:inherit;font-weight:700;
  padding:6px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;font-size:12px;
}
.draft-bar button.ghost{background:transparent;color:#ffe9a8;border:1px solid #b98900}

/* герой */
.hero{padding:70px 0 40px;text-align:center}
.hero h1{
  font-size:clamp(42px,8vw,84px);letter-spacing:6px;text-transform:uppercase;line-height:1;
  background:linear-gradient(90deg,var(--accent),#ff4d4d,var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(102,0,0,.35);
}
.hero p{color:var(--muted);font-size:clamp(16px,2.4vw,22px);max-width:640px;margin:16px auto 0}
.cta{
  display:inline-block;margin-top:28px;padding:14px 34px;font-family:inherit;font-weight:700;
  font-size:16px;letter-spacing:2px;text-transform:uppercase;color:#fff;text-decoration:none;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  box-shadow:0 0 24px color-mix(in srgb, var(--accent) 60%, transparent);
}
.cta:hover{filter:brightness(1.25)}

/* секции */
section{padding:40px 0}
h2{
  font-size:28px;letter-spacing:3px;text-transform:uppercase;margin-bottom:22px;
  padding-left:14px;border-left:4px solid var(--accent);
}

/* свежее видео */
.latest{margin-top:10px}
.latest .frame{
  position:relative;aspect-ratio:16/9;max-width:820px;margin:0 auto;
  border:1px solid var(--line);box-shadow:0 0 40px color-mix(in srgb, var(--accent) 35%, transparent);
  background:var(--panel);
}
.latest iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.latest .cap{max-width:820px;margin:10px auto 0;color:var(--muted);font-size:15px}

/* сетка видео */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.vcard{
  background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--text);
  display:block;transition:.2s;position:relative;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
}
.vcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.vcard:hover{transform:translateY(-4px);box-shadow:0 8px 30px color-mix(in srgb, var(--accent) 45%, transparent)}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.vcard .t{padding:12px 14px 4px;font-weight:600;font-size:16px;line-height:1.3}
.vcard .d{padding:0 14px 14px;color:var(--muted);font-size:13px}
.feed-msg{color:var(--muted);padding:20px 0}
.feed-msg a{color:var(--text)}

/* о канале */
.about-box{
  background:var(--panel);border:1px solid var(--line);padding:26px;font-size:17px;line-height:1.65;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);
}

/* контакты */
.links{display:flex;gap:14px;flex-wrap:wrap}
.link-chip{
  display:flex;align-items:center;gap:10px;padding:12px 20px;text-decoration:none;color:var(--text);
  background:var(--panel);border:1px solid var(--line);font-weight:600;letter-spacing:1px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition:.2s;
}
.link-chip:hover{border-color:var(--accent);box-shadow:0 0 18px color-mix(in srgb, var(--accent) 50%, transparent)}
.link-chip svg{width:22px;height:22px;fill:currentColor}

footer{border-top:1px solid var(--line);margin-top:30px;padding:22px 0 80px;color:var(--muted);font-size:14px}
footer a{color:var(--muted)}
footer .links{margin-top:10px}

/* кнопка админки — одна, внизу по центру */
.admin-fab{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;
  width:52px;height:52px;border-radius:50%;border:2px solid var(--accent);
  background:#141419;color:var(--text);font-size:22px;cursor:pointer;text-decoration:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
}
.admin-fab:hover{filter:brightness(1.3)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <a class="logo" href="#home">
      <img id="avatar" alt="аватар">
      <span><b id="chName">DEADLY_WOLF</b><small id="chTagline"></small></span>
    </a>
    <nav>
      <a href="#home" class="active" data-tab="home">Главная</a>
      <a href="#videos" data-tab="videos">Видео</a>
      <a href="#about" data-tab="about">О канале</a>
      <a href="#contacts" data-tab="contacts">Контакты</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="draftBar" class="draft-bar hidden">
    <span id="draftText"></span>
    <button id="draftShow" class="ghost">Показать черновик</button>
    <button id="draftDrop">Убрать черновик</button>
  </div>
</div>

<main class="wrap">

  <section id="home" class="tab-panel active">
    <div class="hero">
      <h1 id="heroTitle">DEADLY_WOLF</h1>
      <p id="heroSubtitle"></p>
      <a class="cta" id="heroCta" href="#videos">Смотреть последние видео</a>
    </div>
    <div class="latest">
      <h2>Свежее видео</h2>
      <div class="frame" id="latestFrame">
        <div class="feed-msg" id="latestMsg">Загружаю последнее видео…</div>
      </div>
      <div class="cap" id="latestCap"></div>
    </div>
  </section>

  <section id="videos" class="tab-panel">
    <h2>Видео</h2>
    <div class="grid" id="grid"></div>
    <div class="feed-msg hidden" id="feedMsg"></div>
  </section>

  <section id="about" class="tab-panel">
    <h2>О канале</h2>
    <div class="about-box" id="aboutText"></div>
  </section>

  <section id="contacts" class="tab-panel">
    <h2>Контакты</h2>
    <div class="links" id="links"></div>
  </section>

</main>

<footer class="wrap">
  <div>© <span id="chNameF">Deadly_wolf</span></div>
  <div class="links" id="footLinks"></div>
  <div style="margin-top:10px"><a href="admin.html">админ-панель</a></div>
</footer>

<a class="admin-fab" href="admin.html" title="Админ-панель">⚙</a>

<script>
const DRAFT_KEY = 'dw_draft_config';
const ICONS = {
  youtube:'<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>',
  telegram:'<svg viewBox="0 0 24 24"><path d="M21.9 3.4 2.7 10.8c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.8c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.6.2 1.8-.9l3.3-15.4c.3-1.3-.5-1.9-1.6-1.7z"/></svg>',
  vk:'<svg viewBox="0 0 24 24"><path d="M12.8 18.4c-6 0-9.4-4.1-9.6-10.9h3c.1 5 2.3 7.1 4.1 7.6V7.5h2.8v4.3c1.7-.2 3.5-2.2 4.1-4.3h2.8a8.5 8.5 0 0 1-3.9 5.5 8.8 8.8 0 0 1 4.5 5.4h-3.1a5.5 5.5 0 0 0-4.3-3.9v3.9h-.4z"/></svg>',
  discord:'<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.2a18 18 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.2 18c2 1.5 4 2.4 5.9 3l1.2-2a12 12 0 0 1-1.9-.9l.5-.4a14 14 0 0 0 12.2 0l.5.4c-.6.4-1.2.7-1.9.9l1.2 2c1.9-.6 3.9-1.5 5.9-3 .6-5.1-.7-9.5-3.5-13.6zM8.4 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4zm7.2 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4z"/></svg>',
  twitch:'<svg viewBox="0 0 24 24"><path d="M4.3 2 2.5 6.7v14.6h5V24h2.8l2.8-2.7h4.2L22.5 16V2H4.3zm16.4 13-3.2 3.2h-5l-2.8 2.7v-2.7H5.8V3.8h14.9V15zm-3.5-7.3v5.4h-1.8V7.7h1.8zm-4.7 0v5.4h-1.8V7.7h1.8z"/></svg>',
  steam:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-10 9.6l5.4 2.2a2.8 2.8 0 0 1 1.6-.5h.2l2.4-3.5v-.1a3.7 3.7 0 1 1 3.7 3.7h-.1l-3.4 2.5v.2a2.8 2.8 0 0 1-5.6.3L2.4 15A10 10 0 1 0 12 2zM6.6 17.7l-1.2-.5a2.1 2.1 0 0 0 3.9.6 2.1 2.1 0 0 0-2.7-3l1.3.5a1.5 1.5 0 0 1-1.3 2.4zm11-6.7a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm0-4.3a1.9 1.9 0 1 0 0 3.7 1.9 1.9 0 0 0 0-3.7z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M19.6 6.7a5.6 5.6 0 0 1-3.4-3.5 5.6 5.6 0 0 1-.3-1.7h-3.5v13.7a2.3 2.3 0 1 1-2.3-2.4c.3 0 .5 0 .8.1V9.3a5.9 5.9 0 1 0 5.1 5.8V8.9a8.9 8.9 0 0 0 5.2 1.7V7.1c-.6 0-1.1-.1-1.6-.4z"/></svg>',
  github:'<svg viewBox="0 0 24 24"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.7 1.2 3.3.9.1-.7.4-1.2.7-1.5-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17 4.7 18 5 18 5c.6 1.6.2 2.8.1 3.1.7.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>'
};
function iconFor(type){
  if(ICONS[type]) return ICONS[type];
  return '<svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="14" font-family="Rajdhani,sans-serif" font-weight="700" fill="currentColor">'+(type||'W').charAt(0).toUpperCase()+'</text></svg>';
}

let liveConfig = null;
let draftConfig = null;
let viewingDraft = false;

async function init(){
  try{
    const r = await fetch('config.json?ts=' + Date.now());
    if(!r.ok) throw new Error(r.status);
    liveConfig = await r.json();
  }catch(e){
    console.error(e);
    const m = document.getElementById('feedMsg');
    if(m){ m.classList.remove('hidden'); m.innerHTML = 'Не удалось загрузить config.json. Проверьте, что файл лежит рядом с index.html в репозитории.'; }
    document.getElementById('latestMsg').textContent = 'config.json недоступен.';
    return;
  }
  try{ draftConfig = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); }catch(e){ draftConfig = null; }

  render(liveConfig);        // по умолчанию — опубликованная версия
  if(liveConfig.channel && liveConfig.channel.channelId) loadFeed(liveConfig.channel.channelId);

  if(draftConfig){
    const bar = document.getElementById('draftBar');
    bar.classList.remove('hidden');
    document.getElementById('draftText').textContent =
      'В браузере есть локальный черновик — он не опубликован. Сайт показывает опубликованную версию.';
    document.getElementById('draftShow').style.display = '';
  }
}

function render(cfg){
  if(!cfg) return;
  document.title = cfg.channel ? cfg.channel.name : 'Канал';
  if(cfg.channel){
    document.getElementById('chName').textContent = (cfg.channel.name||'').toUpperCase();
    document.getElementById('chNameF').textContent = cfg.channel.name||'';
    document.getElementById('chTagline').textContent = cfg.channel.tagline||'';
    document.getElementById('avatar').src = cfg.channel.avatar || 'https://unavatar.io/youtube/default';
  }
  if(cfg.hero){
    document.getElementById('heroTitle').textContent = cfg.hero.title || '';
    document.getElementById('heroSubtitle').textContent = cfg.hero.subtitle || '';
    document.getElementById('heroCta').textContent = cfg.hero.cta || 'Смотреть последние видео';
  }
  document.getElementById('aboutText').textContent = cfg.about || '';
  if(cfg.theme){
    document.documentElement.style.setProperty('--accent', cfg.theme.accent || '#660000');
    document.documentElement.style.setProperty('--accent2', cfg.theme.accent2 || '#320b35');
  }
  const links = document.getElementById('links');
  const foot = document.getElementById('footLinks');
  links.innerHTML = ''; foot.innerHTML = '';
  (cfg.links||[]).forEach(l=>{
    const a = document.createElement('a');
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
    a.className = 'link-chip';
    a.innerHTML = iconFor(l.type) + '<span>' + escapeHtml(l.title||l.type||'ссылка') + '</span>';
    links.appendChild(a);
    const f = document.createElement('a');
    f.href = l.url; f.target = '_blank'; f.rel = 'noopener'; f.textContent = l.title||l.type||'ссылка';
    foot.appendChild(f);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- лента видео: ВСЕГДА из опубликованного конфига ---------- */
let feedLoaded = false;

async function loadFeed(channelId){
  const feedUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + channelId;
  const sources = [
    { name:'rss2json',
      url:'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feedUrl),
      parse: r => (r.items||[]).map(i=>({ title:i.title, link:i.link, date:i.pubDate })) },
    { name:'allorigins',
      url:'https://api.allorigins.win/raw?url=' + encodeURIComponent(feedUrl),
      xml:true },
    { name:'corsproxy',
      url:'https://corsproxy.io/?url=' + encodeURIComponent(feedUrl),
      xml:true }
  ];
  for(const s of sources){
    try{
      const r = await fetch(s.url, {cache:'no-store'});
      if(!r.ok) throw new Error(s.name + ' HTTP ' + r.status);
      const items = s.xml ? parseXml(await r.text()) : s.parse(await r.json());
      if(items && items.length){
        renderGrid(items);
        renderLatest(items[0]);
        feedLoaded = true;
        return;
      }
    }catch(e){ console.warn('источник', s.name, 'не сработал:', e); }
  }
  const msg = document.getElementById('feedMsg');
  msg.classList.remove('hidden');
  msg.innerHTML = 'Сервисы ленты временно недоступны. Видео можно посмотреть прямо на канале: <a href="https://www.youtube.com/@' + (liveConfig.channel.handle||'').replace('@','') + '" target="_blank">YouTube</a>.';
  document.getElementById('latestMsg').textContent = 'Лента временно недоступна.';
}

function parseXml(text){
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  return Array.from(doc.getElementsByTagName('entry')).map(e=>{
    const link = Array.from(e.getElementsByTagName('link')).find(l=>l.getAttribute('rel')==='alternate');
    return {
      title: (e.getElementsByTagName('title')[0]||{}).textContent || '',
      link: link ? link.getAttribute('href') : '',
      date: (e.getElementsByTagName('published')[0]||{}).textContent || ''
    };
  });
}

function videoId(link){
  const m = String(link||'').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function renderGrid(items){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  items.slice(0,9).forEach(v=>{
    const id = videoId(v.link);
    if(!id) return;
    const a = document.createElement('a');
    a.href = v.link; a.target = '_blank'; a.rel = 'noopener';
    a.className = 'vcard';
    a.innerHTML = '<img loading="lazy" src="https://i.ytimg.com/vi/' + id + '/mqdefault.jpg" alt="">' +
                  '<div class="t">' + escapeHtml(v.title) + '</div>' +
                  '<div class="d">' + fmtDate(v.date) + '</div>';
    grid.appendChild(a);
  });
}

function renderLatest(v){
  const id = videoId(v.link);
  const frame = document.getElementById('latestFrame');
  if(!id){ frame.innerHTML = ''; return; }
  frame.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '" title="Свежее видео" allowfullscreen loading="lazy"></iframe>';
  document.getElementById('latestCap').textContent = v.title || '';
}

function fmtDate(d){
  if(!d) return '';
  const t = new Date(d);
  return isNaN(t) ? '' : t.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
}

/* ---------- черновик: только по явному выбору ---------- */
document.getElementById('draftShow').addEventListener('click', function(){
  if(!draftConfig) return;
  viewingDraft = !viewingDraft;
  if(viewingDraft){
    render(draftConfig);
    this.textContent = 'Вернуться к опубликованной версии';
    document.getElementById('draftText').textContent =
      'Сейчас показан черновик (виден только вам). Видео всегда загружаются из опубликованной версии.';
  }else{
    render(liveConfig);
    this.textContent = 'Показать черновик';
    document.getElementById('draftText').textContent =
      'В браузере есть локальный черновик — он не опубликован. Сайт показывает опубликованную версию.';
  }
});
document.getElementById('draftDrop').addEventListener('click', ()=>{
  localStorage.removeItem(DRAFT_KEY);
  draftConfig = null;
  document.getElementById('draftBar').classList.add('hidden');
  render(liveConfig);
});

/* вкладки */
document.querySelectorAll('nav a').forEach(a=>{
  a.addEventListener('click', ()=>{
    document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));
    a.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById(a.dataset.tab).classList.add('active');
  });
});

init();
</script>
</body>
</html>
