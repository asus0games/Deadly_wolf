<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadly_wolf — канал</title>
<style>
:root{--accent:#660000;--accent2:#320b35;--bg:#0d0b12;--panel:#171420;--text:#e8e4f0;--muted:#9a92b0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
a{color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(13,11,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid #2a2438}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);object-fit:cover}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),#a04560,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.95rem}
nav button:hover{color:var(--text)}
nav button.active{color:var(--text);border-color:var(--accent);background:rgba(102,0,0,.18)}
main{padding:28px 16px 80px}
.tab{display:none}.tab.active{display:block}
.hero{padding:40px 24px;border-radius:16px;background:linear-gradient(135deg,rgba(102,0,0,.35),rgba(50,11,53,.5)),var(--panel);border:1px solid #2a2438;text-align:center}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),#c25a7a,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:12px auto 20px;max-width:560px;color:var(--muted);font-size:1.05rem}
.btn{display:inline-block;padding:12px 22px;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;font-weight:600;cursor:pointer;border:none;font-size:1rem}
.btn:hover{filter:brightness(1.2)}
.latest{margin-top:24px}
.latest .frame{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;border:1px solid #2a2438}
.latest iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px}
.card{background:var(--panel);border:1px solid #2a2438;border-radius:12px;overflow:hidden;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .thumb{position:relative;padding-top:56.25%;background:#1f1a2c}
.card .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .meta{padding:12px 14px}
.card .meta h3{font-size:.95rem;font-weight:600;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta .date{color:var(--muted);font-size:.8rem}
.panel{background:var(--panel);border:1px solid #2a2438;border-radius:14px;padding:24px;line-height:1.65}
.panel h2{margin-bottom:12px}
.links{display:flex;gap:12px;flex-wrap:wrap}
.link-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;background:rgba(102,0,0,.25);border:1px solid var(--accent);text-decoration:none;font-weight:600}
.link-btn:hover{background:rgba(102,0,0,.45)}
footer{border-top:1px solid #2a2438;padding:20px 16px;text-align:center;color:var(--muted);font-size:.85rem}
.admin-btn{position:fixed;right:14px;bottom:14px;z-index:50;width:44px;height:44px;border-radius:50%;border:1px solid var(--accent);background:var(--panel);color:var(--muted);font-size:1.2rem;cursor:pointer}
.admin-btn:hover{color:var(--text);border-color:#c25a7a}
.draft-note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#3a2c08;border:1px solid #8a6d1a;color:#f0d878;padding:10px 14px;border-radius:10px;margin-bottom:18px;font-size:.9rem}
.draft-note button{background:#8a6d1a;color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer}
.status{padding:40px 20px;text-align:center;color:var(--muted)}
.status a{color:#c25a7a}
@media(max-width:640px){nav{width:100%;justify-content:center;margin-left:0}}
</style>
</head>
<body>
<header><div class="wrap topbar">
<img class="avatar" id="avatar" alt="">
<div class="brand" id="brand">…</div>
<nav id="nav">
<button data-tab="home" class="active">Главная</button>
<button data-tab="videos">Видео</button>
<button data-tab="about">О канале</button>
<button data-tab="contacts">Контакты</button>
</nav>
</div></header>
<main class="wrap">
<div id="draftNote" style="display:none" class="draft-note">
<span>Показывается черновик из админки (сохранён в этом браузере), а не версия с сайта.</span>
<button id="draftClear">Убрать черновик</button>
</div>
<section id="tab-home" class="tab active">
<div class="hero"><h1 id="heroTitle"></h1><p id="heroSub"></p><a class="btn" href="#videos" id="heroCta"></a></div>
<div class="latest"><h2 style="margin:24px 0 12px">Последнее видео</h2>
<div class="frame" id="latestFrame"><div class="status">Загрузка видео…</div></div></div>
</section>
<section id="tab-videos" class="tab"><h2>Видео</h2><div class="grid" id="videoGrid"><div class="status">Загрузка…</div></div></section>
<section id="tab-about" class="tab"><div class="panel"><h2>О канале</h2><p id="aboutText"></p></div></section>
<section id="tab-contacts" class="tab"><div class="panel"><h2>Контакты и ссылки</h2><div class="links" id="links"></div></div></section>
</main>
<footer><span id="footerText"></span> · <a href="#" id="adminLink2">админ-панель</a></footer>
<button class="admin-btn" id="adminBtn" title="Админ-панель">⚙</button>
<script>
const CID="UCN3_YEiDPE_tUzS0vkQoYYg";
const FEED="https://www.youtube.com/feeds/videos.xml?channel_id="+CID;
const DEFAULT={channel:{name:"Deadly_wolf",handle:"@Deadly00wolf",channelId:CID,url:"https://www.youtube.com/@Deadly00wolf",avatar:"https://unavatar.io/youtube/Deadly00wolf",tagline:"Прохождения, геймплей и просто играем"},hero:{title:"DEADLY_WOLF",subtitle:"Игровые прохождения без пафоса: стреляю, застреваю и помираю.",cta:"Смотреть последние видео"},about:"Привет! Это канал Deadly_wolf. Здесь я выкладываю прохождения игр: Titanfall 2, Euro Truck Simulator 2, Lethal Company, Half-Life 2 и не только. Играю в своё удовольствие — если тебе зашло, подписывайся, дальше будет интереснее.",links:[{type:"youtube",title:"YouTube",url:"https://www.youtube.com/@Deadly00wolf"}],theme:{accent:"#660000",accent2:"#320b35"}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function applyConfig(c){
  const t=(c&&c.theme)||{};
  if(t.accent)document.documentElement.style.setProperty("--accent",t.accent);
  if(t.accent2)document.documentElement.style.setProperty("--accent2",t.accent2);
  const ch=(c&&c.channel)||DEFAULT.channel;
  document.getElementById("avatar").src=ch.avatar||"";
  document.getElementById("brand").textContent=ch.name||"";
  document.title=(ch.name||"Канал")+" — канал";
  const h=(c&&c.hero)||DEFAULT.hero;
  document.getElementById("heroTitle").textContent=h.title||ch.name||"";
  document.getElementById("heroSub").textContent=h.subtitle||ch.tagline||"";
  document.getElementById("heroCta").textContent=h.cta||"Смотреть последние видео";
  document.getElementById("aboutText").textContent=c.about||DEFAULT.about;
  const L=document.getElementById("links");L.innerHTML="";
  (c.links&&c.links.length?c.links:DEFAULT.links).forEach(l=>{
    const a=document.createElement("a");a.className="link-btn";a.href=l.url||"#";a.target="_blank";a.rel="noopener";
    a.innerHTML='<span>'+esc(l.title||l.url||"ссылка")+'</span>';L.appendChild(a);});
}
function renderVideos(items){
  const g=document.getElementById("videoGrid"),f=document.getElementById("latestFrame");
  if(!items.length){const m='<div class="status">Видео пока не загрузились. <a href="https://www.youtube.com/channel/'+CID+'" target="_blank">Смотреть на YouTube</a></div>';
    g.innerHTML=m;f.innerHTML=m;return;}
  const embed=id=>'<iframe loading="lazy" src="https://www.youtube.com/embed/'+id+'" allowfullscreen title="видео"></iframe>';
  f.innerHTML=embed(items[0].id);
  g.innerHTML=items.map(v=>'<a class="card" href="https://www.youtube.com/watch?v='+v.id+'" target="_blank" rel="noopener"><div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg" alt=""></div><div class="meta"><h3>'+esc(v.title)+'</h3><div class="date">'+esc(v.date||"")+'</div></div></a>').join("");
}
function parseFeed(xml){
  const ns={yt:"http://www.youtube.com/xml/schemas/2015",m:"http://search.yahoo.com/mrss/",a:"http://www.w3.org/2005/Atom"};
  const out=[];
  xml.querySelectorAll("entry").forEach(e=>{
    const vid=e.getElementsByTagNameNS(ns.yt,"videoId")[0];
    const t=e.getElementsByTagNameNS(ns.a,"title")[0];
    const p=e.getElementsByTagNameNS(ns.a,"published")[0];
    if(vid)out.push({id:vid.textContent,title:t?t.textContent:"",date:p?new Date(p.textContent).toLocaleDateString("ru-RU"):""});
  });
  return out;
}
async function fetchViaAllOrigins(){
  const r=await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(FEED));
  if(!r.ok)throw 0;return parseFeed(new DOMParser().parseFromString(await r.text(),"text/xml"));
}
async function fetchViaCorsproxy(){
  const r=await fetch("https://corsproxy.io/?"+encodeURIComponent(FEED));
  if(!r.ok)throw 0;return parseFeed(new DOMParser().parseFromString(await r.text(),"text/xml"));
}
async function fetchViaRss2json(){
  const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(FEED));
  const j=await r.json();
  if(j.status!=="ok"||!j.items)throw 0;
  return j.items.map(i=>({id:(i.guid||"").replace("yt:video:",""),title:i.title,date:new Date(i.pubDate).toLocaleDateString("ru-RU")})).filter(v=>v.id);
}
async function loadVideos(){
  const sources=[fetchViaRss2json,fetchViaAllOrigins,fetchViaCorsproxy];
  for(const s of sources){try{const v=await s();if(v.length){renderVideos(v);return;}}catch(e){}}
  renderVideos([]);
}
function loadConfig(){
  let draft=null;try{draft=JSON.parse(localStorage.getItem("siteConfigDraft")||"null");}catch(e){}
  const note=document.getElementById("draftNote");
  if(draft){applyConfig(draft);note.style.display="flex";}
  else{note.style.display="none";fetch("config.json?"+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(applyConfig).catch(()=>applyConfig(DEFAULT));}
}
document.getElementById("draftClear").addEventListener("click",()=>{localStorage.removeItem("siteConfigDraft");location.reload();});
document.getElementById("adminBtn").addEventListener("click",()=>location.href="admin.html");
document.getElementById("adminLink2").addEventListener("click",e=>{e.preventDefault();location.href="admin.html";});
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+b.dataset.tab).classList.add("active");
}));
document.getElementById("heroCta").addEventListener("click",e=>{e.preventDefault();
  document.querySelector('#nav button[data-tab="videos"]').click();});
loadConfig();loadVideos();
</script>
</body>
</html>
