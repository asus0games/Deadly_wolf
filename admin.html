<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ-панель — Deadly_wolf</title>
<style>
:root{--accent:#8b5cf6;--accent2:#e11d48;--bg:#0b0d14;--panel:#141828;--line:#23283c;--text:#e8eaf2;--muted:#9aa3b5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:1.6rem;margin-bottom:6px}
h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.status{border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:.95rem;display:none}
.status.ok{display:block;background:#12301c;border:1px solid #2f7d4a;color:#8fe3ae}
.status.warn{display:block;background:#33290f;border:1px solid #8a6d1f;color:#f3d98a}
.status.err{display:block;background:#3a1216;border:1px solid #a33;color:#f1a3a3}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.bar button,.bar label{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:10px;cursor:pointer;font-size:.95rem}
.bar button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;font-weight:600}
.bar button:hover{border-color:var(--accent)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;font-family:monospace}
.fld input[type=text],.fld input[type=number],.fld textarea{width:100%;background:#0e1120;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
.fld textarea{min-height:110px;resize:vertical}
.fld input[type=color]{width:52px;height:38px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;vertical-align:middle;margin-right:10px}
.sec{border:1px dashed var(--line);border-radius:14px;padding:16px;margin:14px 0}
.sec h3{font-size:1rem;margin-bottom:12px;color:var(--accent)}
.listitem{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.listitem input[type=text]{flex:1;background:#0e1120;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit}
.del{background:none;border:1px solid #a33;color:#f1a3a3;border-radius:8px;padding:6px 12px;cursor:pointer}
.add{background:none;border:1px dashed var(--muted);color:var(--muted);border-radius:10px;padding:8px 16px;cursor:pointer;margin-top:6px}
.add:hover{border-color:var(--accent);color:var(--text)}
.check{display:flex;align-items:center;gap:10px}
.login{max-width:400px;margin:12vh auto;text-align:center}
.login input{width:100%;margin:14px 0;background:#0e1120;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 14px;font-size:1.05rem;text-align:center}
.login .btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:10px;padding:12px;font-size:1rem;font-weight:600;cursor:pointer}
.login .err{color:#f1a3a3;font-size:.9rem;min-height:1.2em}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hidden{display:none}
</style>
</head>
<body>
<div class="login card" id="login-box">
  <h1>Админ-панель <span>Deadly_wolf</span></h1>
  <p class="sub">Введите пароль администратора</p>
  <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password">
  <button class="btn" id="login-btn">Войти</button>
  <div class="err" id="login-err"></div>
</div>

<div class="wrap hidden" id="panel">
  <h1>Админ-панель <span>Deadly_wolf</span></h1>
  <p class="sub">Правьте config.json, затем скачайте его и загрузите в репозиторий GitHub — изменения появятся на сайте.</p>
  <div class="status" id="status"></div>
  <div class="bar">
    <button class="primary" id="dl">⬇ Скачать config.json</button>
    <button id="save-draft">💾 Сохранить в браузере (черновик)</button>
    <label for="file-inp">📂 Открыть файл…<input type="file" id="file-inp" accept=".json" hidden></label>
    <button id="reload">↻ Перезагрузить с сайта</button>
    <button id="add-field">+ Поле</button>
    <button id="logout">Выйти</button>
  </div>
  <form id="form" class="card" onsubmit="return false"></form>
</div>

<script>
const SALT = "Deadly00wolf:";
const PW_HASH = "1a3a1223ddbe0648214b4f7797ebf3441e57f28ca30f4b93464ff1d95dc8aee2";
const AUTH_KEY = "dw_admin_auth";
const DRAFT_KEY = "dw_config_draft_v1";
let CFG = null;

async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function setStatus(msg, cls){
  const el = document.getElementById("status");
  el.className = "status " + cls; el.textContent = msg;
}
/* ---------- вход ---------- */
async function tryLogin(){
  const h = await sha256(SALT + document.getElementById("pw").value);
  if (h === PW_HASH){
    sessionStorage.setItem(AUTH_KEY, "1");
    showPanel();
  } else {
    document.getElementById("login-err").textContent = "Неверный пароль";
    const box = document.getElementById("login-box");
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  }
}
document.getElementById("login-btn").addEventListener("click", tryLogin);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
document.getElementById("logout").addEventListener("click", () => { sessionStorage.removeItem(AUTH_KEY); location.reload(); });
if (sessionStorage.getItem(AUTH_KEY) === "1") showPanel();

function showPanel(){
  document.getElementById("login-box").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  init();
}
/* ---------- построение формы по config.json ---------- */
function setPath(path, value){
  const parts = path.split(".");
  let obj = CFG;
  for (let i = 0; i < parts.length - 1; i++){
    const k = parts[i];
    if (Array.isArray(obj)) obj = obj[+k]; else obj = obj[k];
  }
  const last = parts[parts.length - 1];
  if (Array.isArray(obj)) obj[+last] = value; else obj[last] = value;
}
function renderField(path, val, container){
  const wrap = document.createElement("div");
  wrap.className = "fld";
  const lab = document.createElement("label");
  lab.textContent = path;
  wrap.appendChild(lab);
  const isColor = typeof val === "string" && /^#[0-9a-fA-F]{6}$/.test(val);
  if (typeof val === "boolean"){
    const box = document.createElement("div"); box.className = "check";
    const inp = document.createElement("input"); inp.type = "checkbox"; inp.checked = val;
    inp.addEventListener("change", () => setPath(path, inp.checked));
    box.appendChild(inp); box.appendChild(lab.cloneNode(true)); wrap.innerHTML = ""; wrap.appendChild(box);
  } else if (isColor){
    const row = document.createElement("div");
    const inp = document.createElement("input"); inp.type = "color"; inp.value = val;
    const txt = document.createElement("input"); txt.type = "text"; txt.value = val; txt.style.width = "110px";
    inp.addEventListener("input", () => { txt.value = inp.value; setPath(path, inp.value); });
    txt.addEventListener("input", () => { inp.value = txt.value; setPath(path, txt.value); });
    row.appendChild(inp); row.appendChild(txt); wrap.appendChild(row);
  } else if (typeof val === "number"){
    const inp = document.createElement("input"); inp.type = "number"; inp.value = val;
    inp.addEventListener("input", () => setPath(path, parseFloat(inp.value) || 0));
    wrap.appendChild(inp);
  } else if (typeof val === "string" && val.length > 80){
    const inp = document.createElement("textarea"); inp.value = val;
    inp.addEventListener("input", () => setPath(path, inp.value));
    wrap.appendChild(inp);
  } else if (typeof val === "string"){
    const inp = document.createElement("input"); inp.type = "text"; inp.value = val;
    inp.addEventListener("input", () => setPath(path, inp.value));
    wrap.appendChild(inp);
  } else if (Array.isArray(val)){
    renderList(path, val, wrap);
  } else if (val && typeof val === "object"){
    const sec = document.createElement("div"); sec.className = "sec";
    const h = document.createElement("h3"); h.textContent = path; sec.appendChild(h);
    for (const [k, v] of Object.entries(val)) renderField(path + "." + k, v, sec);
    wrap.appendChild(sec);
  }
  container.appendChild(wrap);
}
function renderList(path, arr, container){
  const box = document.createElement("div");
  const itemsAreObjects = arr.length && typeof arr[0] === "object";
  function draw(){
    box.innerHTML = "";
    arr.forEach((item, i) => {
      if (item && typeof item === "object"){
        const sec = document.createElement("div"); sec.className = "sec";
        for (const [k, v] of Object.entries(item)) renderField(path + "." + i + "." + k, v, sec);
        const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "✕ удалить";
        del.addEventListener("click", () => { arr.splice(i, 1); draw(); });
        sec.appendChild(del); box.appendChild(sec);
      } else {
        const row = document.createElement("div"); row.className = "listitem";
        const inp = document.createElement("input"); inp.type = "text"; inp.value = item;
        inp.addEventListener("input", () => { arr[i] = inp.value; });
        const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "✕";
        del.addEventListener("click", () => { arr.splice(i, 1); draw(); });
        row.appendChild(inp); row.appendChild(del); box.appendChild(row);
      }
    });
    const add = document.createElement("button"); add.type = "button"; add.className = "add"; add.textContent = "+ добавить элемент";
    add.addEventListener("click", () => { arr.push(itemsAreObjects ? { title: "", url: "" } : ""); draw(); });
    box.appendChild(add);
  }
  draw();
  container.appendChild(box);
}
function renderForm(){
  const f = document.getElementById("form");
  f.innerHTML = "";
  for (const [k, v] of Object.entries(CFG)) renderField(k, v, f);
}
/* ---------- добавление нового поля ---------- */
document.getElementById("add-field").addEventListener("click", () => {
  const name = prompt("Имя нового поля (по-английски, например mySetting):");
  if (!name || !/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) { if (name !== null) alert("Только латинские буквы, цифры и подчёркивание."); return; }
  const type = prompt("Тип поля:\n1 — текст\n2 — длинный текст\n3 — число\n4 — цвет\n5 — список ссылок (заголовок + адрес)");
  if (!type) return;
  const val = { "1": "", "2": "", "3": 0, "4": "#8b5cf6", "5": [{ title: "", url: "" }] }[type];
  if (val === undefined) return;
  CFG[name] = val; renderForm();
});
/* ---------- загрузка конфига ---------- */
function ingest(obj, msg, cls){
  try { CFG = typeof obj === "string" ? JSON.parse(obj) : obj; }
  catch(e){ setStatus("Ошибка: файл не похож на JSON — " + e.message, "err"); return; }
  renderForm(); setStatus(msg, cls);
}
async function loadFromSite(){
  try {
    const r = await fetch("config.json", { cache: "no-store" });
    if (r.ok){ ingest(await r.json(), "Загружен config.json с сайта — вы видите реальное содержимое репозитория.", "ok"); return; }
    setStatus("config.json не найден рядом с admin.html", "warn");
  } catch(e){
    setStatus("Не удалось прочитать config.json. Похоже, вы открыли admin.html как локальный файл двойным кликом — браузер в этом режиме блокирует чтение файлов. Откройте админку по адресу GitHub Pages (…github.io/ваш-репозиторий/admin.html) или загрузите config.json кнопкой «Открыть файл…».", "warn");
  }
  if (!CFG) CFG = {};
}
document.getElementById("reload").addEventListener("click", loadFromSite);
document.getElementById("file-inp").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => ingest(rd.result, "Загружен файл " + f.name + " с компьютера.", "ok");
  rd.readAsText(f);
});
/* ---------- сохранение ---------- */
function download(){
  const blob = new Blob([JSON.stringify(CFG, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "config.json"; a.click();
  URL.revokeObjectURL(a.href);
  setStatus("Файл config.json скачан. Загрузите его в репозиторий: Add file → Upload files → Commit changes.", "ok");
}
document.getElementById("dl").addEventListener("click", download);
document.getElementById("save-draft").addEventListener("click", () => {
  localStorage.setItem(DRAFT_KEY, JSON.stringify(CFG));
  setStatus("Черновик сохранён в этом браузере: откройте index.html — он уже показывает ваши правки. Чтобы опубликовать для всех — «Скачать config.json» и загрузить в репозиторий.", "ok");
});
async function init(){
  await loadFromSite();
  const draft = localStorage.getItem(DRAFT_KEY);
  if (draft){
    try { CFG = JSON.parse(draft); renderForm(); setStatus("Загружен ваш черновик из прошлого раза (кнопка «Перезагрузить с сайта» вернёт опубликованную версию).", "warn"); } catch(e){}
  }
}
</script>
</body>
</html>
