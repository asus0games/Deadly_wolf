<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ-панель — Deadly_wolf</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#660000;--accent2:#320b35;--bg:#0a0a0f;--panel:#14121c;--text:#eceaf3;--muted:#9a97ab;--border:#2b2438}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:18px;line-height:1.5;min-height:100vh;padding:0 0 80px}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px}
h1{font-size:26px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
#status{padding:10px 14px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:16px;margin-bottom:18px}
#status.ok{border-color:#2f6b2f;color:#8fd98f}
#status.warn{border-color:#7a5f00;background:#4a3b00;color:#ffe9a8}
#login{max-width:380px;margin:80px auto;padding:28px;background:var(--panel);border:1px solid var(--border)}
#login h2{margin-bottom:14px;font-size:20px;text-transform:uppercase;letter-spacing:1px}
input,select,textarea{width:100%;background:#0d0c13;border:1px solid var(--border);color:var(--text);
 font-family:inherit;font-size:17px;padding:9px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
label{display:block;margin:14px 0 5px;color:var(--muted);font-size:15px;letter-spacing:.5px}
button.b{background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:700;
 font-size:16px;letter-spacing:1px;padding:10px 18px;margin:6px 8px 0 0}
button.b:hover{filter:brightness(1.25)}
button.b.dim{background:#2a2438;color:var(--muted)}
button.b.warn{background:#4a3b00;color:#ffe9a8}
fieldset{border:1px solid var(--border);margin:16px 0;padding:12px 14px}
legend{color:#ff6a6a;letter-spacing:1px;font-size:14px;text-transform:uppercase;padding:0 6px}
.linkrow{display:grid;grid-template-columns:130px 1fr 2fr 40px;gap:8px;align-items:end;margin-bottom:8px}
.linkrow button{height:40px;background:#3a1020;color:#ff8a8a;border:1px solid #5a1c2e;cursor:pointer;font-size:18px}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow input[type=color]{width:52px;height:40px;padding:2px;flex:none}
.btns{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" hidden>
    <h2>Вход в админ-панель</h2>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" placeholder="Пароль">
    <div style="margin-top:14px"><button class="b" id="loginBtn" type="button">Войти</button></div>
    <p id="loginErr" style="color:#ff8a8a;margin-top:10px;min-height:1em"></p>
  </div>

  <div id="panel" hidden>
    <h1>Админ-панель</h1>
    <div id="status">Загрузка…</div>
    <div id="form"></div>
    <div class="btns">
      <button class="b" id="dlBtn" type="button">Скачать config.json</button>
      <button class="b" id="openBtn" type="button">Открыть файл с компьютера</button>
      <button class="b dim" id="reloadBtn" type="button">Перезагрузить с сайта</button>
      <button class="b dim" id="draftBtn" type="button">Сохранить в браузере</button>
      <button class="b warn" id="clearDraftBtn" type="button">Убрать черновик</button>
      <button class="b dim" id="addFieldBtn" type="button">+ Поле</button>
      <button class="b dim" id="logoutBtn" type="button">Выйти</button>
    </div>
    <input id="fileInput" type="file" accept=".json,application/json" hidden>
  </div>
</div>

<script>
(function(){
  var SHA = '59955d932cb56b499e95ade43256550cd6848b4950fcbf17c803e00ec4081491';
  var FNV = 'cd4cd7b8';
  var DRAFT_KEY = 'dw_draft_config';
  var q = function(s){return document.querySelector(s)};
  var CFG = null;

  function fnv(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*16777619)>>>0}return ('0000000'+h.toString(16)).slice(-8)}
  function sha256Hex(str){
    if(!(window.crypto && crypto.subtle)) return Promise.resolve(null);
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
      .then(function(buf){return Array.prototype.map.call(new Uint8Array(buf), function(x){return ('0'+x.toString(16)).slice(-2)}).join('')});
  }

  function status(msg, cls){
    var s = q('#status');
    s.textContent = msg;
    s.className = cls || '';
  }

  // ---------- вход ----------
  function tryLogin(){
    var pw = q('#pw').value;
    sha256Hex(pw).then(function(h){
      var okSha = (h === SHA);
      var okFnv = (fnv(pw) === FNV);
      if(okSha || okFnv){
        sessionStorage.setItem('dw_admin','1');
        q('#login').hidden = true;
        q('#panel').hidden = false;
        loadFromSite();
      } else {
        q('#loginErr').textContent = 'Неверный пароль.';
      }
    });
  }
  q('#loginBtn').addEventListener('click', tryLogin);
  q('#pw').addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });

  q('#logoutBtn').addEventListener('click', function(){
    sessionStorage.removeItem('dw_admin');
    q('#panel').hidden = true;
    q('#login').hidden = false;
  });

  if(sessionStorage.getItem('dw_admin')==='1'){
    q('#login').hidden = true;
    q('#panel').hidden = false;
    loadFromSite();
  } else {
    q('#login').hidden = false;
  }

  // ---------- работа с конфигом ----------
  function getPath(o, p){ return p.split('.').reduce(function(a,k){ return a ? a[k] : undefined }, o); }
  function setPath(o, p, v){
    var ks = p.split('.'); var c = o;
    for(var i=0;i<ks.length-1;i++){
      if(typeof c[ks[i]] !== 'object' || c[ks[i]] === null) c[ks[i]] = {};
      c = c[ks[i]];
    }
    c[ks[ks.length-1]] = v;
  }

  function label(p){ return p; }

  function addScalar(container, path, value){
    var lab = document.createElement('label');
    lab.textContent = label(path);
    container.appendChild(lab);
    var isColor = /^#[0-9a-fA-F]{6}$/.test(value||'');
    var isLong = (value||'').length > 80 || value === getPath(CFG, path) && /\n/.test(value||'');
    var isKeyLong = /about|description|text/i.test(path);
    if(isColor){
      var row = document.createElement('div'); row.className='colorrow';
      var c1 = document.createElement('input'); c1.type='color'; c1.value = value || '#000000';
      var c2 = document.createElement('input'); c2.type='text'; c2.value = value || '';
      c1.addEventListener('input', function(){ c2.value = c1.value; apply(c1.value); });
      c2.addEventListener('change', function(){ if(/^#[0-9a-fA-F]{6}$/.test(c2.value)) apply(c2.value); });
      function apply(v){ setPath(CFG, path, v); }
      row.appendChild(c1); row.appendChild(c2);
      container.appendChild(row);
    } else if(isLong || isKeyLong){
      var ta = document.createElement('textarea');
      ta.value = value == null ? '' : value;
      ta.addEventListener('input', function(){ setPath(CFG, path, ta.value); });
      container.appendChild(ta);
    } else {
      var inp = document.createElement('input');
      inp.type = 'text'; inp.value = value == null ? '' : value;
      inp.addEventListener('input', function(){ setPath(CFG, path, inp.value); });
      container.appendChild(inp);
    }
  }

  function addLinkRow(container, item, idx){
    var row = document.createElement('div'); row.className = 'linkrow';
    var sel = document.createElement('select');
    ['youtube','telegram','vk','discord','steam','twitch','tiktok','other'].forEach(function(t){
      var o = document.createElement('option'); o.value = t; o.textContent = t;
      if((item.type||'other') === t) o.selected = true;
      sel.appendChild(o);
    });
    var ti = document.createElement('input'); ti.type='text'; ti.value = item.title || '';
    ti.placeholder = 'Название';
    var ur = document.createElement('input'); ur.type='text'; ur.value = item.url || '';
    ur.placeholder = 'https://…';
    var del = document.createElement('button'); del.type='button'; del.textContent='✕'; del.title='Удалить ссылку';
    function sync(){ CFG.links[idx] = {type: sel.value, title: ti.value, url: ur.value}; }
    sel.addEventListener('change', sync); ti.addEventListener('input', sync); ur.addEventListener('input', sync);
    del.addEventListener('click', function(){
      CFG.links.splice(idx, 1);
      renderLinksEditor(q('#linksBox'));
    });
    row.appendChild(sel); row.appendChild(ti); row.appendChild(ur); row.appendChild(del);
    container.appendChild(row);
  }

  function renderLinksEditor(box){
    box.innerHTML = '';
    (CFG.links || []).forEach(function(item, i){ addLinkRow(box, item, i); });
    var add = document.createElement('button');
    add.type='button'; add.className='b dim'; add.textContent = '+ Добавить ссылку';
    add.addEventListener('click', function(){
      CFG.links = CFG.links || [];
      CFG.links.push({type:'other', title:'', url:''});
      renderLinksEditor(q('#linksBox'));
    });
    box.appendChild(add);
  }

  function buildForm(obj, path, container){
    Object.keys(obj).forEach(function(key){
      var v = obj[key];
      var p = path ? path + '.' + key : key;
      if(key === 'links' && Array.isArray(v)) return; // отдельно
      if(Array.isArray(v)){
        if(v.length && typeof v[0] === 'object'){
          var fs = document.createElement('fieldset');
          var lg = document.createElement('legend'); lg.textContent = label(p);
          fs.appendChild(lg);
          v.forEach(function(item, i){
            Object.keys(item).forEach(function(k){
              addScalar(fs, p + '[' + i + '].' + k, item[k]);
            });
          });
          container.appendChild(fs);
        } else {
          addScalar(container, p, v.join('\n'));
        }
      } else if(typeof v === 'object' && v !== null){
        var fs2 = document.createElement('fieldset');
        var lg2 = document.createElement('legend'); lg2.textContent = label(p);
        fs2.appendChild(lg2);
        buildForm(v, p, fs2);
        container.appendChild(fs2);
      } else {
        addScalar(container, p, v);
      }
    });
    // редактор ссылок
    var fsl = document.createElement('fieldset');
    var lgl = document.createElement('legend'); lgl.textContent = 'links — список ссылок';
    fsl.appendChild(lgl);
    var lb = document.createElement('div'); lb.id = 'linksBox';
    fsl.appendChild(lb);
    container.appendChild(fsl);
    renderLinksEditor(lb);
  }

  function showConfig(cfg, where){
    CFG = cfg;
    q('#form').innerHTML = '';
    buildForm(cfg, '', q('#form'));
    status(where, 'ok');
  }

  function loadFromSite(){
    fetch('config.json?cache=' + Date.now())
      .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
      .then(function(c){ showConfig(c, 'Загружен config.json с сайта. Всё, что есть в конфиге, доступно для правки.'); })
      .catch(function(){
        status('Не удалось загрузить config.json. Если вы открыли admin.html как файл с диска — браузер блокирует чтение соседних файлов. Открывайте админку по адресу GitHub Pages: …github.io/имя-репозитория/admin.html', 'warn');
        showConfig({channel:{name:'',handle:'',channelId:'',url:'',avatar:'',tagline:''}, hero:{title:'',subtitle:'',cta:''}, about:'', links:[], theme:{accent:'#660000',accent2:'#320b35'}}, '');
      });
  }
  q('#reloadBtn').addEventListener('click', loadFromSite);

  // ---------- кнопки ----------
  q('#dlBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(CFG, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'config.json';
    a.click();
    URL.revokeObjectURL(a.href);
    status('Файл config.json скачан. Загрузите его в репозиторий (Add file → Upload files), чтобы изменения увидели все посетители.', 'ok');
  });

  q('#openBtn').addEventListener('click', function(){ q('#fileInput').click(); });
  q('#fileInput').addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        showConfig(JSON.parse(rd.result), 'Загружен файл с компьютера: ' + f.name);
      }catch(err){
        status('Файл не удалось прочитать: это не корректный JSON.', 'warn');
      }
    };
    rd.readAsText(f);
  });

  q('#draftBtn').addEventListener('click', function(){
    try{
      localStorage.setItem(DRAFT_KEY, JSON.stringify(CFG));
      status('Черновик сохранён в этом браузере. Откройте сайт — он покажет черновик. Чтобы изменения увидели все — нажмите «Скачать config.json» и загрузите файл в репозиторий.', 'ok');
    }catch(e){ status('Не удалось сохранить черновик (localStorage недоступен).', 'warn'); }
  });

  q('#clearDraftBtn').addEventListener('click', function(){
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    status('Черновик удалён. Сайт снова показывает опубликованную версию из репозитория.', 'ok');
  });

  q('#addFieldBtn').addEventListener('click', function(){
    var name = prompt('Имя нового поля (можно вложенное, например hero.note):');
    if(!name) return;
    var val = prompt('Значение поля (оставьте пустым, чтобы заполнить позже):') || '';
    setPath(CFG, name.trim(), val);
    q('#form').innerHTML = '';
    buildForm(CFG, '', q('#form'));
    status('Поле «' + name.trim() + '» добавлено. Не забудьте скачать config.json и загрузить его в репозиторий.', 'ok');
  });
})();
</script>
</body>
</html>
