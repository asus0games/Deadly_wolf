<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadly_wolf — канал</title>
<style>
  :root{
    --accent:#660000;
    --accent2:#320b35;
    --bg:#0b0b10;
    --card:#15151d;
    --text:#e8e6ef;
    --muted:#9a97a8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  /* ---------- шапка ---------- */
  header{
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
    padding:36px 20px 26px;
    text-align:center;
  }
  .avatar{
    width:88px;height:88px;border-radius:50%;
    border:3px solid rgba(255,255,255,.35);
    margin:0 auto 12px;display:block;
    object-fit:cover;background:#222;
  }
  header h1{
    font-size:clamp(24px,5vw,38px);
    letter-spacing:3px;text-transform:uppercase;
    text-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  header .tagline{color:rgba(255,255,255,.8);margin-top:6px;font-size:15px}
  .sub{color:rgba(255,255,255,.65);margin-top:4px;font-size:13px}
  /* ---------- навигация ---------- */
  nav{
    display:flex;justify-content:center;gap:6px;flex-wrap:wrap;
    background:rgba(0,0,0,.35);
    padding:10px 12px;
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(6px);
  }
  nav button{
    background:transparent;color:var(--text);
    border:1px solid rgba(255,255,255,.25);
    border-radius:20px;padding:8px 18px;
    font-size:14px;cursor:pointer;transition:.2s;
  }
  nav button:hover{border-color:var(--accent)}
  nav button.active{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  /* ---------- контент ---------- */
  main{max-width:960px;margin:0 auto;padding:26px 18px 90px}
  section{display:none}
  section.active{display:block}
  h2{font-size:20px;margin-bottom:16px;color:var(--text)}
  .card{
    background:var(--card);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:18px;margin-bottom:16px;
  }
  /* hero */
  .hero{text-align:center;padding:34px 18px}
  .hero h2{font-size:clamp(20px,4vw,30px)}
  .hero p{color:var(--muted);margin:10px auto 20px;max-width:560px}
  .btn{
    display:inline-block;background:var(--accent);color:#fff;
    padding:11px 26px;border-radius:24px;text-decoration:none;
    font-size:15px;transition:.2s;border:none;cursor:pointer;
  }
  .btn:hover{filter:brightness(1.25)}
  /* видео */
  .video-main{aspect-ratio:16/9;width:100%;border:none;border-radius:14px;background:#000}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px;margin-top:18px;
  }
  .vcard{
    background:var(--card);border:1px solid rgba(255,255,255,.08);
    border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s;
    text-decoration:none;color:var(--text);display:block;
  }
  .vcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
  .vcard .vt{padding:10px 12px;font-size:14px;line-height:1.35}
  .vcard .vd{padding:0 12px 12px;font-size:12px;color:var(--muted)}
  /* about */
  .about p{line-height:1.65;color:var(--text);white-space:pre-line}
  /* контакты */
  .link-btn{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid rgba(255,255,255,.1);
    border-radius:12px;padding:14px 18px;margin-bottom:12px;
    color:var(--text);text-decoration:none;transition:.2s;
  }
  .link-btn:hover{border-color:var(--accent);transform:translateX(4px)}
  .link-btn .ic{font-size:20px}
  /* сообщения */
  .note{color:var(--muted);font-size:14px;padding:18px;text-align:center}
  .draft-banner{
    background:#4a3b00;color:#ffe9a8;
    padding:10px 16px;font-size:13.5px;
    display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;
  }
  .draft-banner button{
    background:#ffe9a8;color:#4a3b00;border:none;border-radius:14px;
    padding:5px 14px;font-size:13px;cursor:pointer;font-weight:600;
  }
  /* ---------- кнопка админки: ОДНА, снизу по центру ---------- */
  #adminBtn{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    background:rgba(20,20,28,.85);color:var(--muted);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;padding:6px 16px;font-size:12.5px;
    cursor:pointer;z-index:90;backdrop-filter:blur(4px);transition:.2s;
  }
  #adminBtn:hover{color:var(--text);border-color:var(--accent)}
  footer{
    text-align:center;color:var(--muted);font-size:12.5px;
    padding:20px 0 70px;
  }
  footer a{color:var(--muted)}
  @media(max-width:520px){
    nav button{padding:7px 12px;font-size:13px}
  }
</style>
</head>
<body>

<div id="draftBanner" class="draft-banner" style="display:none">
  <span>Сейчас показан <b>черновик из админки</b>, а не опубликованный сайт</span>
  <button id="clearDraft">Убрать черновик</button>
</div>

<header>
  <img class="avatar" id="avatar" alt="аватар канала">
  <h1 id="chName">Deadly_wolf</h1>
  <div class="tagline" id="chTagline"></div>
  <div class="sub" id="chHandle"></div>
</header>

<nav>
  <button data-tab="home" class="active">Главная</button>
  <button data-tab="videos">Видео</button>
  <button data-tab="about">О канале</button>
  <button data-tab="contacts">Контакты</button>
</nav>

<main>
  <section id="tab-home" class="active">
    <div class="card hero">
      <h2 id="heroTitle"></h2>
      <p id="heroSubtitle"></p>
      <a class="btn" id="heroCta" href="#videos">Смотреть последние видео</a>
    </div>
    <h2>Последнее видео</h2>
    <div id="latestWrap"></div>
    <div id="homeGrid" class="grid"></div>
  </section>

  <section id="tab-videos">
    <h2>Видео канала</h2>
    <div id="videosGrid" class="grid"></div>
    <div id="videosNote" class="note"></div>
  </section>

  <section id="tab-about">
    <h2>О канале</h2>
    <div class="card about"><p id="aboutText"></p></div>
  </section>

  <section id="tab-contacts">
    <h2>Контакты и ссылки</h2>
    <div id="linksWrap"></div>
    <div id="linksNote" class="note" style="display:none">Ссылки появятся, когда админ добавит их в config.json</div>
  </section>
</main>

<button id="adminBtn" title="Админ-панель">⚙ Админ-панель</button>

<footer>
  <span id="footerName">Deadly_wolf</span> · сайт-визитка канала
</footer>

<script>
const DRAFT_KEY='dw_config_draft';
const CHANNEL_ID_FALLBACK='UCN3_YEiDPE_tUzS0vkQoYYg';
let CONFIG=null;

/* ---------- загрузка конфига ---------- */
function applyConfig(c){
  CONFIG=c;
  const ch=c.channel||{},th=c.theme||{};
  document.documentElement.style.setProperty('--accent',th.accent||'#660000');
  document.documentElement.style.setProperty('--accent2',th.accent2||'#320b35');
  document.title=(ch.name||'Канал')+' — сайт';
  document.getElementById('chName').textContent=ch.name||'Канал';
  document.getElementById('chTagline').textContent=ch.tagline||'';
  document.getElementById('chHandle').textContent=ch.handle||'';
  document.getElementById('footerName').textContent=ch.name||'Канал';
  document.getElementById('avatar').src=ch.avatar||('https://unavatar.io/youtube/'+(ch.handle||'').replace('@',''));
  const h=c.hero||{};
  document.getElementById('heroTitle').textContent=h.title||ch.name||'';
  document.getElementById('heroSubtitle').textContent=h.subtitle||'';
  document.getElementById('heroCta').textContent=h.cta||'Смотреть видео';
  document.getElementById('aboutText').textContent=c.about||'';
  /* ссылки */
  const lw=document.getElementById('linksWrap');
  lw.innerHTML='';
  const icons={youtube:'▶',telegram:'✈',vk:'В',discord:'🎮',twitch:'🎮',steam:'🎮',tiktok:'♪',instagram:'📷',default:'🔗'};
  (c.links||[]).forEach(l=>{
    const a=document.createElement('a');
    a.className='link-btn';a.href=l.url;a.target='_blank';a.rel='noopener';
    a.innerHTML='<span class="ic">'+(icons[(l.type||'').toLowerCase()]||icons.default)+'</span><span>'+(l.title||l.url)+'</span>';
    lw.appendChild(a);
  });
  document.getElementById('linksNote').style.display=(c.links&&c.links.length)?'none':'block';
}

function loadConfig(){
  const draft=localStorage.getItem(DRAFT_KEY);
  if(draft){
    try{
      applyConfig(JSON.parse(draft));
      document.getElementById('draftBanner').style.display='flex';
    }catch(e){localStorage.removeItem(DRAFT_KEY);}
  }
  fetch('config.json')
    .then(r=>{if(!r.ok)throw 0;return r.json()})
    .then(published=>{
      if(!draft)applyConfig(published);
      else{
        /* черновик показан, но сравним с опубликованным */
        if(JSON.stringify(published)===draft)clearDraft();
      }
    })
    .catch(()=>{ if(!CONFIG)applyConfig(defaultConfig()); });
}
function defaultConfig(){
  return {
    channel:{name:'Deadly_wolf',handle:'@Deadly00wolf',channelId:CHANNEL_ID_FALLBACK,
      url:'https://www.youtube.com/@Deadly00wolf',
      avatar:'https://unavatar.io/youtube/Deadly00wolf',
      tagline:'Прохождения, геймплей и просто играем'},
    hero:{title:'DEADLY_WOLF',subtitle:'Игровые прохождения без пафоса: стреляю, застреваю и помираю.',cta:'Смотреть последние видео'},
    about:'Привет! Это канал Deadly_wolf.',
    links:[{type:'youtube',title:'YouTube',url:'https://www.youtube.com/@Deadly00wolf'}],
    theme:{accent:'#660000',accent2:'#320b35'}
  };
}
function clearDraft(){
  localStorage.removeItem(DRAFT_KEY);
  document.getElementById('draftBanner').style.display='none';
  location.reload();
}
document.getElementById('clearDraft').addEventListener('click',clearDraft);

/* ---------- вкладки ---------- */
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('main section').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
    if(location.hash!=='#'+b.dataset.tab)history.replaceState(null,'','#'+b.dataset.tab);
  });
});
const h=(location.hash||'#home').slice(1);
if(document.getElementById('tab-'+h)){
  document.querySelector('nav button[data-tab="'+h+'"]').click();
}
document.getElementById('heroCta').addEventListener('click',e=>{
  e.preventDefault();
  document.querySelector('nav button[data-tab="videos"]').click();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ---------- видео: три источника по очереди ---------- */
function fmtDate(s){
  try{return new Date(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}
}
function parseXmlRss(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  const out=[];
  doc.querySelectorAll('entry').forEach(en=>{
    const vid=(en.querySelector('videoId')||{}).textContent;
    if(!vid)return;
    out.push({
      id:vid,
      title:(en.querySelector('title')||{}).textContent||'Без названия',
      published:(en.querySelector('published')||{}).textContent||''
    });
  });
  return out;
}
function loadVideos(){
  const feed='https://www.youtube.com/feeds/videos.xml?channel_id='+(CONFIG?.channel?.channelId||CHANNEL_ID_FALLBACK);
  const sources=[
    ()=>fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed))
         .then(r=>r.json()).then(j=>{
            if(!j.items||!j.items.length)throw 0;
            return j.items.map(i=>({id:(i.link.match(/v=([\w-]+)/)||[])[1]||i.guid,
              title:i.title,published:i.pubDate}));
         }),
    ()=>fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(feed))
         .then(r=>r.text()).then(parseXmlRss),
    ()=>fetch('https://corsproxy.io/?url='+encodeURIComponent(feed))
         .then(r=>r.text()).then(parseXmlRss)
  ];
  let i=0;
  const tryNext=()=>{
    if(i>=sources.length){showVideoError();return;}
    sources[i++]().then(renderVideos).catch(()=>setTimeout(tryNext,300));
  };
  tryNext();
}
function showVideoError(){
  const n=document.getElementById('videosNote');
  n.style.display='block';
  n.innerHTML='Сервис ленты видео временно недоступен. Все видео можно посмотреть прямо на <a href="'+(CONFIG?.channel?.url||'#')+'" target="_blank" rel="noopener" style="color:var(--accent2)">YouTube-канале</a>.';
}
function videoCard(v,small){
  const a=document.createElement('a');
  a.className='vcard';
  a.href='https://www.youtube.com/watch?v='+v.id;a.target='_blank';a.rel='noopener';
  a.innerHTML='<img loading="lazy" src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg" alt="">'+
    '<div class="vt">'+v.title+'</div>'+
    (small?'<div class="vd">'+fmtDate(v.published)+'</div>':'');
  return a;
}
function renderVideos(items){
  const ids=items.filter(v=>v.id);
  if(!ids.length){showVideoError();return;}
  document.getElementById('videosNote').style.display='none';
  /* главное видео */
  const lw=document.getElementById('latestWrap');
  lw.innerHTML='';
  const f=document.createElement('iframe');
  f.className='video-main';
  f.src='https://www.youtube.com/embed/'+ids[0].id;
  f.allow='accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture';
  f.allowFullscreen=true;f.loading='lazy';
  lw.appendChild(f);
  /* сетка на главной */
  const hg=document.getElementById('homeGrid');
  hg.innerHTML='';
  ids.slice(1,7).forEach(v=>hg.appendChild(videoCard(v,true)));
  /* полная сетка */
  const vg=document.getElementById('videosGrid');
  vg.innerHTML='';
  ids.slice(0,12).forEach(v=>vg.appendChild(videoCard(v,true)));
}

/* ---------- админ-кнопка (единственная) ---------- */
document.getElementById('adminBtn').addEventListener('click',()=>{
  location.href='admin.html';
});

/* ---------- старт ---------- */
loadConfig();
setTimeout(loadVideos,150);
</script>
</body>
</html>
