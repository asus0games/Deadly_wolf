name: Update videos
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch YouTube feed
        run: python fetch_videos.py
      - name: Commit videos.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Update videos.json" && git push)
