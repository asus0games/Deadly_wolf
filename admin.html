<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Rajdhani',sans-serif;background:#0f0e17;color:#fff;min-height:100vh;padding:20px}
h1{color:#e94560;margin-bottom:20px;font-weight:700}
.field{margin-bottom:15px}
.field label{display:block;margin-bottom:5px;color:#aaa;font-size:14px}
.field input,.field textarea{width:100%;padding:10px;background:#1a1929;border:1px solid #333;border-radius:6px;color:#fff;font-family:inherit;font-size:15px}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:#e94560;outline:none}
.btn{padding:12px 24px;border:none;border-radius:6px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:16px;cursor:pointer;margin:5px 5px 5px 0}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#c73652}
.btn-secondary{background:#7b2cbf;color:#fff}
.btn-secondary:hover{background:#6324a0}
#panel{max-width:800px;margin:0 auto}
.section{background:#1a1929;border-radius:10px;padding:20px;margin-bottom:20px;border:1px solid #2a2939}
.section h2{color:#e94560;margin-bottom:15px;font-size:20px}
.social-item{background:#0f0e17;border-radius:6px;padding:10px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.social-item input{flex:1;padding:8px;background:#1a1929;border:1px solid #333;border-radius:4px;color:#fff;font-family:inherit}
.social-item button{padding:8px 12px;background:#e94560;border:none;border-radius:4px;color:#fff;cursor:pointer;white-space:nowrap}
.github-pub{background:#0f0e17;border-radius:6px;padding:15px;margin-top:10px}
.github-pub input{width:100%;padding:8px;margin-bottom:8px;background:#1a1929;border:1px solid #333;border-radius:4px;color:#fff;font-family:inherit;font-size:14px}
.status{padding:10px;border-radius:6px;margin:10px 0;font-weight:500}
.status.ok{background:#1a3a2a;color:#4ade80}
.status.err{background:#3a1a1a;color:#f87171}
.hidden{display:none}
</style>
</head>
<body>

<div id="panel">
  <h1>⚙️ Админ-панель</h1>
  
  <div class="section">
    <h2>Канал</h2>
    <div class="field"><label>Название канала (channel.name)</label><input id="channel.name" type="text"></div>
    <div class="field"><label>Подпись под названием (channel.tagline)</label><input id="channel.tagline" type="text"></div>
    <div class="field"><label>Логотип (channel.logo)</label><input id="channel.logo" type="text" placeholder="URL картинки"></div>
    <div class="field"><label>YouTube channelId (UC...)</label><input id="channelId" type="text" placeholder="UCXXXXXXXXXXXXXXXXXXXXXX"></div>
  </div>

  <div class="section">
    <h2>Главная страница</h2>
    <div class="field"><label>Заголовок (hero.title)</label><input id="hero.title" type="text"></div>
    <div class="field"><label>Подзаголовок (hero.subtitle)</label><textarea id="hero.subtitle"></textarea></div>
  </div>

  <div class="section">
    <h2>О канале</h2>
    <div class="field"><label>Описание (about)</label><textarea id="about" style="min-height:150px"></textarea></div>
  </div>

  <div class="section">
    <h2>Ссылки</h2>
    <div id="socials"></div>
    <button class="btn btn-secondary" onclick="addSocial()">+ Добавить ссылку</button>
  </div>

  <div class="section">
    <h2>Цвета</h2>
    <div class="field"><label>Основной цвет (theme.primary)</label><input id="theme.primary" type="color"></div>
    <div class="field"><label>Дополнительный (theme.secondary)</label><input id="theme.secondary" type="color"></div>
    <div class="field"><label>Фон (theme.background)</label><input id="theme.background" type="color"></div>
    <div class="field"><label>Акцентный — неон (theme.neon)</label><input id="theme.neon" type="color"></div>
  </div>

  <div class="section">
    <h2>Сохранение</h2>
    <button class="btn btn-primary" onclick="downloadConfig()">⬇ Скачать config.json</button>
    
    <h2 style="margin-top:20px">Прямая публикация на GitHub</h2>
    <div class="github-pub">
      <input id="ghUser" type="text" placeholder="Логин GitHub">
      <input id="ghRepo" type="text" placeholder="Название репозитория">
      <input id="ghToken" type="password" placeholder="Токен (ghp_... или github_pat_...)">
      <button class="btn btn-secondary" onclick="saveCreds()">Запомнить данные</button>
      <button class="btn btn-primary" onclick="publishToGithub()">🚀 Опубликовать на GitHub</button>
      <div id="pubStatus"></div>
    </div>
  </div>
</div>

<script>
// Проверка: зашёл ли через index.html с правильным паролем
if(sessionStorage.getItem('admin_auth')!=='1'){
  window.location.href='index.html';
}

let config={};
let socials=[];

function setVal(id,val){const el=document.getElementById(id);if(el)el.value=val||''}
function getVal(id){const el=document.getElementById(id);return el?el.value:''}

function loadConfig(cfg){
  config=cfg;
  setVal('channel.name',cfg.channel?.name);
  setVal('channel.tagline',cfg.channel?.tagline);
  setVal('channel.logo',cfg.channel?.logo);
  setVal('channelId',cfg.channelId);
  setVal('hero.title',cfg.hero?.title);
  setVal('hero.subtitle',cfg.hero?.subtitle);
  setVal('about',cfg.about);
  setVal('theme.primary',cfg.theme?.primary);
  setVal('theme.secondary',cfg.theme?.secondary);
  setVal('theme.background',cfg.theme?.background);
  setVal('theme.neon',cfg.theme?.neon);
  socials=cfg.socials||[];
  renderSocials();
  const saved=localStorage.getItem('gh_creds');
  if(saved){const c=JSON.parse(saved);setVal('ghUser',c.user);setVal('ghRepo',c.repo);setVal('ghToken',c.token)}
}

function renderSocials(){
  const c=document.getElementById('socials');
  c.innerHTML='';
  socials.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='social-item';
    d.innerHTML=`<input type="text" placeholder="Название" value="${s.name||''}" onchange="socials[${i}].name=this.value"><input type="text" placeholder="URL" value="${s.url||''}" onchange="socials[${i}].url=this.value"><button onclick="socials.splice(${i},1);renderSocials()">✕</button>`;
    c.appendChild(d);
  });
}

function addSocial(){socials.push({name:'',url:'',icon:'link'});renderSocials()}

function buildConfig(){
  config.channel=config.channel||{};
  config.channel.name=getVal('channel.name');
  config.channel.tagline=getVal('channel.tagline');
  config.channel.logo=getVal('channel.logo');
  config.channelId=getVal('channelId');
  config.hero=config.hero||{};
  config.hero.title=getVal('hero.title');
  config.hero.subtitle=getVal('hero.subtitle');
  config.about=getVal('about');
  config.theme=config.theme||{};
  config.theme.primary=getVal('theme.primary');
  config.theme.secondary=getVal('theme.secondary');
  config.theme.background=getVal('theme.background');
  config.theme.neon=getVal('theme.neon');
  config.socials=socials;
  return config;
}

function downloadConfig(){
  const cfg=buildConfig();
  const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='config.json';
  a.click();
}

function saveCreds(){
  const creds={user:getVal('ghUser'),repo:getVal('ghRepo'),token:getVal('ghToken')};
  localStorage.setItem('gh_creds',JSON.stringify(creds));
  showStatus('pubStatus','Данные сохранены в браузере','ok');
}

function showStatus(id,msg,type){document.getElementById(id).innerHTML=`<div class="status ${type}">${msg}</div>`}

async function publishToGithub(){
  const user=getVal('ghUser'),repo=getVal('ghRepo'),token=getVal('ghToken');
  if(!user||!repo||!token){showStatus('pubStatus','Заполните все три поля','err');return}
  const cfg=buildConfig();
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,2))));
  showStatus('pubStatus','Отправка...','ok');
  let sha=null;
  try{
    const r=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/config.json`,{headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok){const d=await r.json();sha=d.sha}
  }catch(e){}
  const body=JSON.stringify({message:'Update config.json via admin',content:content,sha:sha});
  try{
    const r=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/config.json`,{method:'PUT',headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:body});
    if(r.ok){showStatus('pubStatus','✅ Опубликовано! Сайт обновится через ~30 секунд','ok')}
    else{const d=await r.json();showStatus('pubStatus','❌ Ошибка: '+(d.message||r.status),'err')}
  }catch(e){showStatus('pubStatus','❌ Ошибка сети: '+e,'err')}
}

// Загрузка конфига при открытии страницы
fetch('config.json?t='+Date.now()).then(r=>r.json()).then(cfg=>loadConfig(cfg)).catch(e=>alert('Не удалось загрузить config.json: '+e));
</script>
</body>
</html>
