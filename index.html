<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игровой канал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#660000;--c2:#320b35;--neon:#ff2b4a;--txt:#e8e4ef;--dim:#9a93a8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0b0910;color:var(--txt);font-family:'Rajdhani',sans-serif;font-size:17px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:
 radial-gradient(900px 520px at 12% -8%, rgba(230,30,60,.20), transparent 62%),
 radial-gradient(900px 520px at 92% 8%, rgba(150,45,165,.18), transparent 62%),
 repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 56px),
 repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 56px)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:26px 0 8px}
.brand{display:flex;align-items:center;gap:16px}
.avatar{width:68px;height:68px;flex:none;border-radius:10px;object-fit:cover;background:linear-gradient(135deg,var(--c1),var(--c2));clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)}
.brand h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(92deg,#ff2b4a,#b44bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,43,74,.35))}
.tagline{margin:2px 0 0;color:var(--dim);letter-spacing:.4px}
nav{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
nav button{font-family:inherit;font-size:15px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--dim);padding:9px 20px;cursor:pointer;transition:.15s;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
nav button:hover{color:#fff;border-color:rgba(255,255,255,.4)}
nav button.active{color:#fff;border-color:var(--neon);box-shadow:0 0 16px rgba(255,43,74,.35), inset 0 0 14px rgba(255,43,74,.12)}
section{display:none;padding:8px 0 56px}
section.active{display:block}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-left:3px solid var(--neon);padding:20px;margin:16px 0;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
h2{margin:18px 0 8px;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#fff}
h2 span{color:var(--neon)}
.hero-title{margin:14px 0 4px;font-size:clamp(30px,6vw,50px);font-weight:700;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(92deg,#ff2b4a,#b44bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{color:var(--dim);max-width:640px;font-size:18px;line-height:1.5}
.btn{display:inline-block;font-family:inherit;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid rgba(255,255,255,.18);padding:11px 22px;margin:6px 8px 0 0;cursor:pointer;transition:.15s;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.btn:hover{box-shadow:0 0 18px rgba(255,43,74,.45)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.18);padding:9px 16px;background:rgba(255,255,255,.04);transition:.15s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.links a:hover{border-color:var(--neon);box-shadow:0 0 14px rgba(255,43,74,.35)}
.links svg{width:20px;height:20px;fill:currentColor}
.fallback-ico{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--neon);color:var(--neon);font-weight:700;font-size:12px}
.vidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:16px}
.vcard{display:block;text-decoration:none;color:inherit;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-top:2px solid var(--neon);transition:.15s;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.vcard:hover{box-shadow:0 0 20px rgba(255,43,74,.3);transform:translateY(-2px)}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.vcard .t{padding:10px 12px 4px;font-weight:600;line-height:1.3;color:#fff}
.vcard .d{padding:0 12px 12px;color:var(--dim);font-size:14px}
.embed{position:relative;width:100%;aspect-ratio:16/9;border:1px solid rgba(255,255,255,.12)}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.note{color:var(--dim);border:1px dashed rgba(255,255,255,.2);padding:14px;margin-top:14px}
footer{padding:22px 16px 90px;color:#776f85;font-size:14px;border-top:1px solid rgba(255,255,255,.08);text-align:center}
#adminBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:50;font-family:inherit;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid rgba(255,255,255,.25);padding:10px 20px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.5);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
#adminBtn:hover{box-shadow:0 0 18px rgba(255,43,74,.5)}
@media(max-width:640px){.brand{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <img class="logo" id="logo" alt="">
    <div>
      <h1 id="chName">КАНАЛ</h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </div>
  <nav id="nav">
    <button data-tab="home" class="active">Главная</button>
    <button data-tab="videos">Видео</button>
    <button data-tab="about">О канале</button>
    <button data-tab="contacts">Контакты</button>
  </nav>
</header>
<main>
  <section id="tab-home" class="active">
    <div class="hero-title" id="heroTitle"></div>
    <p class="hero-sub" id="heroSub"></p>
    <h2><span>//</span> Свежее видео</h2>
    <div id="latest"></div>
    <div class="links" id="homeLinks" style="margin-top:18px"></div>
  </section>
  <section id="tab-videos">
    <h2><span>//</span> Последние видео</h2>
    <div class="vidgrid" id="grid"></div>
    <div class="note" id="vidNote" style="display:none">Лента загружается или временно недоступна. Сайт берёт видео из кэша репозитория, который обновляется автоматически каждые 3 часа.</div>
  </section>
  <section id="tab-about">
    <h2><span>//</span> О канале</h2>
    <div class="card" id="aboutText"></div>
  </section>
  <section id="tab-contacts">
    <h2><span>//</span> Контакты</h2>
    <div class="card"><div class="links" id="contactLinks"></div></div>
  </section>
</main>
</div>
<footer><span id="footerOwner"></span> · <a href="admin.html" style="color:#9a93a8">админ-панель</a></footer>
<button id="adminBtn" onclick="location.href='admin.html'">⚙ Админ-панель</button>
<script>
const ICONS={
 youtube:'<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>',
 telegram:'<svg viewBox="0 0 24 24"><path d="M23.9 3.6 20.3 20.5c-.3 1.2-1 1.5-2 .9l-5.6-4.1-2.7 2.6c-.3.3-.6.5-1.1.5l.4-5.7L19.6 4.6c.5-.4-.1-.6-.7-.2L6.2 12.6.6 10.8c-1.2-.4-1.2-1.2.3-1.8L22.1 2.2c1-.4 1.9.2 1.8 1.4z"/></svg>',
 vk:'<svg viewBox="0 0 24 24"><path d="M13 17.9c-6 0-9.6-4.2-9.7-11.2h3c.1 5.2 2.4 7.4 4.2 7.9V6.7h2.9v4.5c1.8-.2 3.7-2.2 4.3-4.5h2.9a9 9 0 0 1-3.9 5.7 9.4 9.4 0 0 1 4.6 5.5h-3.2a5.8 5.8 0 0 0-4.7-3.7v3.7H13z"/></svg>',
 discord:'<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.2a16.9 16.9 0 0 0-5.6 0L8.6 3a19.8 19.8 0 0 0-4.9 1.5C.6 9 -.3 13.5.2 17.9a20 20 0 0 0 6 3.1l1.3-2.1a12 12 0 0 1-2-1l.5-.4a14.3 14.3 0 0 0 12 0l.5.4a12 12 0 0 1-2 1l1.3 2.1a20 20 0 0 0 6-3.1c.6-5.1-.7-9.6-3.5-13.5zM8.3 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4zm7.4 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4z"/></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CFG=null;

async function loadConfig(){
  try{
    const r=await fetch('config.json?t='+Date.now());
    if(!r.ok)throw new Error(r.status);
    CFG=await r.json();
  }catch(e){
    CFG={channel:{name:'Канал',tagline:''},hero:{title:'',subtitle:''},about:'',colors:{primary:'#660000',secondary:'#320b35'},links:[],channelId:''};
  }
  render();
  loadVideos();
}

function render(){
  const c=CFG.colors||{};
  if(c.primary)document.documentElement.style.setProperty('--c1',c.primary);
  if(c.secondary)document.documentElement.style.setProperty('--c2',c.secondary);
  const ch=CFG.channel||{},hero=CFG.hero||{};
  $('#chName').textContent=ch.name||'Канал';
  document.title=(ch.name||'Канал');
  $('#tagline').textContent=ch.tagline||'';
  $('#avatar').src=(ch&&ch.avatar)?ch.avatar:'https://placehold.co/136/660000/ffffff?text=GAME';
  $('#heroTitle').textContent=hero.title||ch.name||'';
  $('#heroSub').textContent=hero.subtitle||'';
  $('#aboutText').textContent=CFG.about||'';
  $('#footerOwner').textContent=ch.owner?('© '+new Date().getFullYear()+' '+ch.owner):'';
  const links=Array.isArray(CFG.links)?CFG.links:[];
  renderLinks($('#homeLinks'),links);
  renderLinks($('#contactLinks'),links);
}

function renderLinks(box,links){
  box.innerHTML='';
  links.forEach(l=>{
    if(!l||!l.url)return;
    const a=document.createElement('a');
    a.href=l.url;a.target='_blank';a.rel='noopener';
    const t=(ICONS[l.type]?'<span class="i">'+ICONS[l.type]+'</span>':'<span class="fallback-ico">'+esc((l.title||l.type||'?').charAt(0).toUpperCase())+'</span>');
    a.innerHTML=t+'<span>'+esc(l.title||l.type||'Ссылка')+'</span>';
    box.appendChild(a);
  });
}

async function loadVideos(){
  let vids=[];
  try{
    const r=await fetch('videos.json?t='+Date.now());
    const d=await r.json();
    if(d&&Array.isArray(d.videos))vids=d.videos;
  }catch(e){}
  if(!vids.length)vids=await fetchViaProxy();
  draw(vids);
}

async function fetchViaProxy(){
  const cid=(CFG&&CFG.channelId)||'';
  if(!cid)return [];
  const feed='https://www.youtube.com/feeds/videos.xml?channel_id='+cid;
  const proxies=[
    'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(feed),
    'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(feed)
  ];
  for(const p of proxies){
    try{
      const r=await fetch(p);
      const txt=await r.text();
      let items=[];
      if(txt.trim().startsWith('{')){
        const j=JSON.parse(txt);
        items=(j.items||[]).map(i=>({id:(i.link.match(/v=([\w-]+)/)||[])[1]||'',title:i.title||'',published:i.pubDate||'',link:i.link||'',thumb:i.thumbnail||''}));
      }else{
        const doc=new DOMParser().parseFromString(txt,'text/xml');
        items=[...doc.querySelectorAll('entry')].map(e=>{
          const id=(e.querySelector('videoId')||{}).textContent||'';
          const lk=e.querySelector('link');
          return{id:id||(lk?(lk.getAttribute('href').match(/v=([\w-]+)/)||[])[1]||'':''),
            title:(e.querySelector('title')||{}).textContent||'',
            published:(e.querySelector('published')||{}).textContent||'',
            link:lk?lk.getAttribute('href'):'',thumb:''};
        }).map(v=>({...v,thumb:v.thumb||'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'}));
      }
      items=items.filter(v=>v.id);
      if(items.length)return items;
    }catch(e){}
  }
  return [];
}

function draw(vids){
  const grid=$('#grid'),latest=$('#latest'),note=$('#vidNote');
  if(!vids.length){note.style.display='block';latest.innerHTML='';return;}
  note.style.display='none';
  const v=vids[0];
  latest.innerHTML='<div class="card"><div class="embed"><iframe src="https://www.youtube.com/embed/'+encodeURIComponent(v.id)+'" allowfullscreen loading="lazy"></iframe></div><h3 style="margin:12px 0 0">'+esc(v.title)+'</h3><a class="btn" href="'+esc(v.link)+'" target="_blank" rel="noopener">Смотреть на YouTube</a></div>';
  grid.innerHTML='';
  vids.slice(0,9).forEach(x=>{
    const a=document.createElement('a');
    a.className='vcard';a.href=x.link;a.target='_blank';a.rel='noopener';
    a.innerHTML='<img loading="lazy" src="'+esc(x.thumb||('https://i.ytimg.com/vi/'+x.id+'/hqdefault.jpg'))+'" alt=""><div class="t">'+esc(x.title)+'</div><div class="d">'+esc((x.published||'').slice(0,10))+'</div>';
    grid.appendChild(a);
  });
}

document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+b.dataset.tab));
});

loadConfig();
</script>
</body>
</html>
