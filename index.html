<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadly Wolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121a;--neon-green:#00ff9d;--neon-blue:#00d4ff;--text:#e0e0e0;--text-dim:#888}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;top:-100px;left:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(0,255,157,.08) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,255,.08) 0%,transparent 70%);pointer-events:none;z-index:0}
body::before,body::after{animation:floatGlow 8s ease-in-out infinite alternate}
@keyframes floatGlow{from{transform:translate(0,0)}to{transform:translate(30px,30px)}}
.container{max-width:1100px;margin:0 auto;padding:20px;position:relative;z-index:1}
/* Hero */
.hero{text-align:center;padding:60px 0 40px}
.avatar{width:130px;height:130px;border-radius:50%;border:3px solid transparent;background-image:linear-gradient(var(--bg),var(--bg)),linear-gradient(135deg,var(--neon-green),var(--neon-blue));background-origin:border-box;background-clip:content-box,border-box;object-fit:cover;margin:0 auto 20px;display:block;box-shadow:0 0 30px rgba(0,255,157,.3)}
.channel-name{font-size:42px;font-weight:700;background:linear-gradient(135deg,var(--neon-green),var(--neon-blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;line-height:1.2}
.channel-desc{color:var(--text-dim);font-size:18px;max-width:500px;margin:0 auto 20px}
/* Social Links */
.social-links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:50px}
.social-link{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:var(--card);border:1px solid #222;border-radius:50px;color:var(--text);text-decoration:none;font-size:16px;font-weight:600;transition:all .25s ease}
.social-link:hover{border-color:var(--neon-green);box-shadow:0 0 15px rgba(0,255,157,.2);transform:translateY(-2px)}
.social-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.youtube-dot{background:#ff0000}.discord-dot{background:#5865f2}.telegram-dot{background:#2aabee}.twitch-dot{background:#9146ff}.vk-dot{background:#0077ff}
/* Latest Video */
.section-title{font-size:24px;font-weight:700;color:var(--text);margin-bottom:20px;padding-left:12px;border-left:3px solid var(--neon-green)}
.latest-video{margin-bottom:50px}
.latest-video iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:12px;box-shadow:0 0 30px rgba(0,0,0,.5)}
.latest-video .video-title{font-size:20px;font-weight:600;margin-top:12px;color:var(--text)}
/* Video Grid */
.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:50px}
.video-card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .25s ease;border:1px solid #1a1a1a}
.video-card:hover{border-color:var(--neon-green);transform:translateY(-4px);box-shadow:0 4px 20px rgba(0,255,157,.15)}
.video-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#111}
.video-thumb img{width:100%;height:100%;object-fit:cover}
.play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s ease}
.play-overlay svg{width:50px;height:50px;fill:var(--neon-green);filter:drop-shadow(0 0 10px rgba(0,255,157,.5))}
.video-card:hover .play-overlay{opacity:1}
.video-card-title{padding:10px 12px;font-size:15px;font-weight:600;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* About */
.about-card{background:var(--card);border-radius:12px;padding:24px;border:1px solid #1a1a1a;margin-bottom:50px}
.about-card h3{font-size:20px;font-weight:700;margin-bottom:12px;color:var(--neon-green)}
.about-card p{color:var(--text-dim);line-height:1.6;font-size:16px}
/* Admin Button */
.admin-btn{display:block;margin:0 auto 40px;padding:8px 20px;background:transparent;border:1px solid #333;border-radius:50px;color:#555;font-family:'Rajdhani',sans-serif;font-size:14px;cursor:pointer;transition:all .25s ease}
.admin-btn:hover{border-color:var(--neon-green);color:var(--neon-green)}
/* Footer */
footer{text-align:center;padding:20px 0;color:#444;font-size:14px}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-box{background:var(--card);border-radius:12px;padding:30px;max-width:400px;width:90%;border:1px solid #333}
.modal-box h2{color:var(--neon-green);margin-bottom:16px;font-size:22px}
.modal-box input{width:100%;padding:10px 14px;background:#0a0a0f;border:1px solid #333;border-radius:8px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:16px;margin-bottom:12px}
.modal-box button{width:100%;padding:10px;background:linear-gradient(135deg,var(--neon-green),var(--neon-blue));border:none;border-radius:8px;color:#000;font-weight:700;font-size:16px;cursor:pointer;font-family:'Rajdhani',sans-serif}
.modal-box .error{color:#ff4444;font-size:14px;margin-bottom:8px;display:none}
/* Responsive */
@media(max-width:768px){
  .container{padding:16px}
  .hero{padding:40px 0 30px}
  .avatar{width:100px;height:100px}
  .channel-name{font-size:30px}
  .channel-desc{font-size:16px}
  .video-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .video-card-title{font-size:13px}
  .latest-video .video-title{font-size:17px}
}
@media(max-width:480px){
  .container{padding:12px}
  .hero{padding:30px 0 20px}
  .avatar{width:84px;height:84px}
  .channel-name{font-size:24px}
  .channel-desc{font-size:14px}
  .social-link{padding:8px 16px;font-size:14px}
  .video-grid{grid-template-columns:1fr;gap:14px}
  .section-title{font-size:20px}
  .about-card p{font-size:14px}
  .about-card h3{font-size:18px}
}
</style>
</head>
<body>

<div class="container">

  <div class="hero">
    <img class="avatar" id="avatar" src="" alt="Avatar" style="display:none">
    <h1 class="channel-name" id="channelName">Загрузка...</h1>
    <p class="channel-desc" id="channelDesc"></p>
    <div class="social-links" id="socialLinks"></div>
  </div>

  <div id="latestVideoSection" style="display:none">
    <h2 class="section-title">Свежее видео</h2>
    <div class="latest-video">
      <iframe id="latestVideoFrame" allowfullscreen></iframe>
      <div class="video-title" id="latestVideoTitle"></div>
    </div>
  </div>

  <div id="moreVideosSection" style="display:none">
    <h2 class="section-title">Другие видео</h2>
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <div id="aboutSection" style="display:none">
    <div class="about-card">
      <h3>О канале</h3>
      <p id="aboutText"></p>
    </div>
  </div>

  <button class="admin-btn" onclick="openAdmin()">Админ-панель</button>
  <footer id="footer"></footer>

</div>

<div class="modal-overlay" id="adminModal">
  <div class="modal-box">
    <h2>Админ-панель</h2>
    <div class="error" id="adminError">Неверный пароль</div>
    <input type="password" id="adminPass" placeholder="Пароль" onkeydown="if(event.key==='Enter')checkAdmin()">
    <button onclick="checkAdmin()">Войти</button>
  </div>
</div>

<script>
const ADMIN_PASS='Deadly00wolf';

async function loadConfig(){
  try{
    const resp=await fetch('config.json?ts='+Date.now());
    if(!resp.ok) throw new Error('config not found');
    const cfg=await resp.json();
    renderConfig(cfg);
  }catch(e){
    console.error('Config load error:',e);
  }
}

function renderConfig(cfg){
  const ch=cfg.channel||cfg;
  document.getElementById('channelName').textContent=ch.name||'Deadly Wolf';
  document.getElementById('channelDesc').textContent=ch.description||'';
  if(ch.avatar){
    const av=document.getElementById('avatar');
    av.src=ch.avatar;
    av.style.display='block';
  }
  if(ch.about){
    document.getElementById('aboutText').textContent=ch.about;
    document.getElementById('aboutSection').style.display='block';
  }
  const links=ch.links||cfg.links||[];
  const sl=document.getElementById('socialLinks');
  sl.innerHTML='';
  const dotMap={youtube:'youtube-dot',discord:'discord-dot',telegram:'telegram-dot',twitch:'twitch-dot',vk:'vk-dot'};
  links.forEach(link=>{
    const a=document.createElement('a');
    a.className='social-link';
    a.href=link.url;
    a.target='_blank';
    a.rel='noopener';
    const dot=document.createElement('span');
    dot.className='social-dot '+(dotMap[link.type]||'youtube-dot');
    a.appendChild(dot);
    a.appendChild(document.createTextNode(link.label||link.type));
    sl.appendChild(a);
  });
  if(ch.footer||cfg.footer){
    document.getElementById('footer').textContent=ch.footer||cfg.footer;
  }
}

async function loadVideos(){
  try{
    const resp=await fetch('videos.json?ts='+Date.now());
    if(!resp.ok) throw new Error('videos not found');
    const videos=await resp.json();
    if(!Array.isArray(videos)||videos.length===0) throw new Error('empty');
    renderVideos(videos);
  }catch(e){
    console.error('Videos load error:',e);
  }
}

function renderVideos(videos){
  if(videos.length===0) return;
  const latest=videos[0];
  document.getElementById('latestVideoFrame').src='https://www.youtube.com/embed/'+latest.id;
  document.getElementById('latestVideoTitle').textContent=latest.title||'';
  document.getElementById('latestVideoSection').style.display='block';

  if(videos.length>1){
    const grid=document.getElementById('videoGrid');
    grid.innerHTML='';
    videos.slice(1,10).forEach(v=>{
      const card=document.createElement('div');
      card.className='video-card';
      card.onclick=()=>window.open('https://www.youtube.com/watch?v='+v.id,'_blank');
      const thumb=document.createElement('div');
      thumb.className='video-thumb';
      const img=document.createElement('img');
      img.src=v.thumbnail||('https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg');
      img.alt=v.title||'';
      img.loading='lazy';
      const overlay=document.createElement('div');
      overlay.className='play-overlay';
      overlay.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      thumb.appendChild(img);
      thumb.appendChild(overlay);
      const title=document.createElement('div');
      title.className='video-card-title';
      title.textContent=v.title||'';
      card.appendChild(thumb);
      card.appendChild(title);
      grid.appendChild(card);
    });
    document.getElementById('moreVideosSection').style.display='block';
  }
}

function openAdmin(){document.getElementById('adminModal').classList.add('active');document.getElementById('adminPass').focus()}
function closeAdmin(){document.getElementById('adminModal').classList.remove('active');document.getElementById('adminPass').value='';document.getElementById('adminError').style.display='none'}
function checkAdmin(){
  const pass=document.getElementById('adminPass').value;
  if(pass===ADMIN_PASS){
    closeAdmin();
    window.location.href='admin.html';
  }else{
    document.getElementById('adminError').style.display='block';
  }
}

document.getElementById('adminModal').addEventListener('click',function(e){if(e.target===this)closeAdmin()});

loadConfig();
loadVideos();
</script>
</body>
</html>
