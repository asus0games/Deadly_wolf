<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadly Wolf</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#e94560;--secondary:#7b2cbf;--bg:#0f0e17}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:#fff;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:0 20px}

/* Header */
header{position:sticky;top:0;z-index:100;background:rgba(15,14,23,0.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(233,69,96,0.2)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:15px 0}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.logo-text h1{font-size:22px;font-weight:700;color:var(--primary)}
.logo-text span{font-size:13px;color:#888}
nav{display:flex;gap:25px}
nav a{font-size:16px;font-weight:500;transition:color 0.2s;cursor:pointer}
nav a:hover{color:var(--primary)}
.nav-mobile{display:none}

/* Hero */
.hero{position:relative;padding:80px 0;text-align:center;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(233,69,96,0.15),transparent 70%);pointer-events:none}
.hero h2{font-size:48px;font-weight:700;margin-bottom:15px;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:20px;color:#aaa;max-width:600px;margin:0 auto;line-height:1.6}

/* Sections */
.section{padding:60px 0}
.section-title{font-size:32px;font-weight:700;margin-bottom:30px;display:flex;align-items:center;gap:15px}
.section-title::before{content:'';width:4px;height:32px;background:var(--primary);border-radius:2px}

/* Videos */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.video-card{background:#1a1929;border-radius:10px;overflow:hidden;transition:transform 0.2s,border-color 0.2s;border:1px solid #2a2939;cursor:pointer}
.video-card:hover{transform:translateY(-5px);border-color:var(--primary)}
.video-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#0f0e17}
.video-info{padding:15px}
.video-info h3{font-size:16px;font-weight:600;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-info span{font-size:13px;color:#666}
.video-loading{text-align:center;padding:40px;color:#666;font-size:18px}
.video-error{text-align:center;padding:40px;color:#e94560;font-size:16px}

/* Latest video */
.latest-video{display:flex;justify-content:center;margin-bottom:30px}
.latest-video .video-card{max-width:700px;width:100%}
.latest-video .video-thumb{aspect-ratio:16/9}

/* About */
.about-text{font-size:18px;line-height:1.8;color:#ccc;max-width:700px}
.about-text p{margin-bottom:15px}

/* Socials */
.socials{display:flex;gap:15px;flex-wrap:wrap}
.social-link{display:flex;align-items:center;gap:10px;padding:12px 24px;background:#1a1929;border:1px solid #2a2939;border-radius:8px;transition:all 0.2s;font-weight:600}
.social-link:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 5px 20px rgba(233,69,96,0.2)}
.social-link svg{width:20px;height:20px}

/* Tabs */
.tab-content{display:none}
.tab-content.active{display:block}

/* Footer */
footer{padding:40px 0;border-top:1px solid rgba(233,69,96,0.1);text-align:center}
.admin-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 20px;background:rgba(26,25,41,0.9);border:1px solid #2a2939;border-radius:20px;color:#666;font-size:13px;cursor:pointer;font-family:inherit;transition:color 0.2s}
.admin-btn:hover{color:var(--primary)}

@media(max-width:768px){
  nav{display:none}
  .nav-mobile{display:block}
  .hero h2{font-size:32px}
  .hero p{font-size:16px}
  .section-title{font-size:24px}
}
</style>
</head>
<body>

<header>
<div class="container header-inner">
  <div class="logo">
    <img id="logo" src="" alt="" style="display:none">
    <div class="logo-text">
      <h1 id="channelName">Deadly Wolf</h1>
      <span id="channelTagline"></span>
    </div>
  </div>
  <nav>
    <a onclick="showTab('home')">Главная</a>
    <a onclick="showTab('videos')">Видео</a>
    <a onclick="showTab('about')">О канале</a>
    <a onclick="showTab('links')">Ссылки</a>
  </nav>
</div>
</header>

<div class="tab-content active" id="tab-home">
  <div class="hero">
    <div class="container">
      <h2 id="heroTitle"></h2>
      <p id="heroSubtitle"></p>
    </div>
  </div>
  <div class="section" id="latestSection" style="display:none">
    <div class="container">
      <div class="section-title">Свежее видео</div>
      <div class="latest-video" id="latestVideo"></div>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-videos">
  <div class="section">
    <div class="container">
      <div class="section-title">Видео</div>
      <div class="video-grid" id="videoGrid">
        <div class="video-loading">Загрузка видео...</div>
      </div>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-about">
  <div class="section">
    <div class="container">
      <div class="section-title">О канале</div>
      <div class="about-text" id="aboutText"></div>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-links">
  <div class="section">
    <div class="container">
      <div class="section-title">Ссылки</div>
      <div class="socials" id="socials"></div>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <p id="footerText"></p>
  </div>
</footer>

<button class="admin-btn" onclick="location.href='admin.html'">⚙️ Админ-панель</button>

<script>
let config = {};
let videos = [];

function showTab(tab){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  window.scrollTo(0,0);
}

function applyTheme(){
  if(config.theme){
    document.documentElement.style.setProperty('--primary',config.theme.primary||'#e94560');
    document.documentElement.style.setProperty('--secondary',config.theme.secondary||'#7b2cbf');
    document.documentElement.style.setProperty('--bg',config.theme.background||'#0f0e17');
  }
}

function renderChannel(){
  document.getElementById('channelName').textContent = config.channel?.name || '';
  document.getElementById('channelTagline').textContent = config.channel?.tagline || '';
  const logo = document.getElementById('logo');
  if(config.channel?.logo){
    logo.src = config.channel.logo;
    logo.style.display = 'block';
  }
  document.getElementById('heroTitle').textContent = config.hero?.title || '';
  document.getElementById('heroSubtitle').textContent = config.hero?.subtitle || '';
  document.getElementById('aboutText').innerHTML = (config.about||'').split('\n').map(p=>`<p>${p}</p>`).join('');
  document.title = config.channel?.name || 'Канал';
}

function renderSocials(){
  const c = document.getElementById('socials');
  if(!config.socials || config.socials.length===0){
    c.innerHTML = '<p style="color:#666">Ссылки не добавлены</p>';
    return;
  }
  const icons = {
    youtube:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.5 15.5v-7l6.5 3.5z"/></svg>',
    discord:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.3 5.3A17 17 0 0 0 15 4l-.3.5a12 12 0 0 1 3.8 1.8 13 13 0 0 0-13 0A12 12 0 0 1 9.3 4.5L9 4a17 17 0 0 0-4.3 1.3C2 9.3 1.3 13.2 1.6 17a17 17 0 0 0 5 2.5l.7-1.1a11 11 0 0 1-1.6-.8l.4-.3a12 12 0 0 0 10 0l.4.3a11 11 0 0 1-1.6.8l.7 1.1a17 17 0 0 0 5-2.5c.4-4.6-.7-8.5-3.3-11.7zM8.5 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm7 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>',
    telegram:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 2L2 10.5l5.5 2L18 6l-8 7.5L18 19l4-17z"/></svg>',
    twitch:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2L2 6v14h5v3h3l3-3h4l5-5V2H4zm16 11l-3 3h-4l-3 3v-3H7V4h13v9zM15 7h2v5h-2zM11 7h2v5h-2z"/></svg>'
  };
  c.innerHTML = config.socials.map(s=>`
    <a href="${s.url}" target="_blank" class="social-link">
      ${icons[s.icon]||icons[s.name?.toLowerCase()]||'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 6H6c-2 0-3 1-3 3v8c0 2 1 3 3 3h12c2 0 3-1 3-3V9c0-2-1-3-3-3h-4l-2-2H10z"/></svg>'}
      ${s.name}
    </a>
  `).join('');
}

function renderVideos(){
  const grid = document.getElementById('videoGrid');
  if(videos.length===0){
    grid.innerHTML = '<div class="video-error">Лента временно недоступна</div>';
    return;
  }
  
  // Последнее видео на главную
  const latest = videos[0];
  const latestSec = document.getElementById('latestSection');
  const latestEl = document.getElementById('latestVideo');
  if(latest){
    latestSec.style.display = 'block';
    latestEl.innerHTML = `
      <div class="video-card" onclick="window.open('${latest.url}','_blank')">
        <img class="video-thumb" src="${latest.thumbnail}" alt="${latest.title}" loading="lazy">
        <div class="video-info"><h3>${latest.title}</h3><span>${latest.published||''}</span></div>
      </div>`;
  }
  
  // Все видео во вкладке
  grid.innerHTML = videos.map(v=>`
    <div class="video-card" onclick="window.open('${v.url}','_blank')">
      <img class="video-thumb" src="${v.thumbnail}" alt="${v.title}" loading="lazy">
      <div class="video-info"><h3>${v.title}</h3><span>${v.published||''}</span></div>
    </div>
  `).join('');
}

async function loadVideos(){
  // Сначала пробуем локальный videos.json
  try{
    const r = await fetch('videos.json?_='+Date.now());
    if(r.ok){
      const d = await r.json();
      if(d.videos && d.videos.length>0){
        videos = d.videos;
        renderVideos();
        return;
      }
    }
  }catch(e){}
  
  // Запасной путь — прокси
  if(config.channelId && !config.channelId.includes('XXXX')){
    const proxies = [
      `https://api.allorigins.win/raw?url=https://www.youtube.com/feeds/videos.xml?channel_id=${config.channelId}`,
      `https://api.codetabs.com/v1/proxy?quest=https://www.youtube.com/feeds/videos.xml?channel_id=${config.channelId}`
    ];
    for(const url of proxies){
      try{
        const r = await fetch(url);
        if(r.ok){
          const text = await r.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text,'text/xml');
          const entries = doc.querySelectorAll('entry');
          videos = [];
          entries.forEach((e,i)=>{
            if(i>=9) return;
            const title = e.querySelector('title')?.textContent;
            const vid = e.querySelector('videoId')?.textContent;
            const thumb = e.querySelector('thumbnail')?.getAttribute('url');
            const pub = e.querySelector('published')?.textContent;
            if(title && vid){
              videos.push({title,id:vid,url:`https://www.youtube.com/watch?v=${vid}`,thumbnail:thumb||'',published:pub||''});
            }
          });
          if(videos.length>0){renderVideos();return;}
        }
      }catch(e){}
    }
  }
  renderVideos();
}

async function init(){
  try{
    const r = await fetch('config.json');
    if(!r.ok){return;}
    config = await r.json();
    applyTheme();
    renderChannel();
    renderSocials();
    loadVideos();
  }catch(e){
    console.error(e);
  }
}

init();
</script>
</body>
</html>
