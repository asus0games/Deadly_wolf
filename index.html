<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadly_wolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#660000;--accent2:#320b35;--bg:#0b0b0e;--panel:#141318;--text:#e8e6e3;--muted:#9a97a0;--line:#2a2830}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:18px;line-height:1.5;
  background-image:linear-gradient(160deg,rgba(102,0,0,.28),rgba(50,11,53,.28) 60%,transparent),
  repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.025) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.025) 39px 40px);
  background-attachment:fixed;min-height:100vh}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
/* шапка */
.site-header{position:relative;padding:34px 0 0;overflow:hidden}
.site-header:before{content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);opacity:.45;z-index:-1;
  clip-path:polygon(0 0,100% 0,100% 78%,0 100%)}
.site-header:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent))}
.head-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);
  box-shadow:0 0 18px rgba(102,0,0,.6)}
.ch-name{font-size:34px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ch-tagline{color:var(--muted);font-weight:500}
nav{display:flex;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--line)}
nav button{background:none;border:none;color:var(--muted);font:inherit;font-weight:600;text-transform:uppercase;
  letter-spacing:1px;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{color:var(--text)}
nav button.active{color:#fff;border-bottom-color:var(--accent)}
main{padding:28px 0 70px}
.hero{padding:14px 0 8px}
.hero h1{font-size:clamp(38px,7vw,64px);font-weight:700;letter-spacing:3px;text-transform:uppercase;
  text-shadow:0 0 24px rgba(102,0,0,.8)}
.hero p{color:var(--muted);font-size:22px;margin:8px 0 18px}
.btn{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;
  font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:12px 26px;text-decoration:none;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  box-shadow:0 0 16px rgba(102,0,0,.55);transition:filter .2s}
.btn:hover{filter:brightness(1.25)}
h2.sec{font-size:26px;text-transform:uppercase;letter-spacing:2px;margin:34px 0 16px;position:relative;padding-left:14px}
h2.sec:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:5px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
/* свежее видео */
.fresh-card{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.fresh-card img{width:56%;object-fit:cover;display:block;aspect-ratio:16/9}
.fresh-info{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.fresh-info .vtitle{font-size:22px;font-weight:700;text-decoration:none}
.fresh-info .vtitle:hover{color:var(--accent)}
.vdate{color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:1px}
/* сетка видео */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);text-decoration:none;display:block;
  transition:transform .15s,box-shadow .15s,border-color .15s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.vcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 0 18px rgba(102,0,0,.45)}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.vcard .vt{padding:10px 12px 4px;font-weight:600;line-height:1.3}
.vcard .vd{padding:0 12px 12px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.status{color:var(--muted);padding:20px 0}
/* о канале */
.about-text{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);
  padding:20px 22px;font-size:19px}
/* контакты */
.links{display:flex;gap:14px;flex-wrap:wrap}
.link-card{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  padding:12px 18px;text-decoration:none;font-weight:600;transition:border-color .2s,box-shadow .2s;
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
.link-card:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(102,0,0,.5)}
.link-card svg{width:22px;height:22px;fill:currentColor}
.badge{display:inline-block;background:var(--accent2);padding:2px 8px;font-size:12px;letter-spacing:1px;color:#d9cfe6}
/* плашка черновика */
#draft-banner{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#2b2410;color:#ffe9b0;
  border-top:2px solid #b58a2a;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:16px}
#draft-banner button{background:#b58a2a;border:none;color:#1c1608;font:inherit;font-weight:700;padding:6px 14px;cursor:pointer}
#draft-banner button.ghost{background:none;border:1px solid #b58a2a;color:#ffe9b0}
/* кнопка админки */
#admin-btn{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;
  width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);background:var(--panel);
  color:var(--text);font-size:20px;cursor:pointer;box-shadow:0 0 14px rgba(102,0,0,.6)}
#admin-btn:hover{filter:brightness(1.3)}
footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);text-align:center;font-size:14px}
@media(max-width:640px){.fresh-card{flex-direction:column}.fresh-card img{width:100%}}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <div class="head-row">
      <img class="avatar" id="avatar" alt="Аватар канала">
      <div>
        <div class="ch-name" id="ch-name"></div>
        <div class="ch-tagline" id="ch-tagline"></div>
      </div>
    </div>
    <nav>
      <button data-tab="home" class="active">Главная</button>
      <button data-tab="videos">Видео</button>
      <button data-tab="about">О канале</button>
      <button data-tab="contact">Контакты</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-home">
    <div class="hero">
      <h1 id="hero-title"></h1>
      <p id="hero-subtitle"></p>
      <a class="btn" id="hero-cta" href="#" onclick="switchTab('videos');return false;"></a>
    </div>
    <h2 class="sec">Свежее видео</h2>
    <div id="fresh-slot"><div class="status">Загружаю…</div></div>
  </section>

  <section id="tab-videos" hidden>
    <h2 class="sec">Последние видео</h2>
    <div class="vgrid" id="videos-grid"></div>
    <div class="status" id="videos-status" hidden></div>
  </section>

  <section id="tab-about" hidden>
    <h2 class="sec">О канале</h2>
    <div class="about-text" id="about-text"></div>
  </section>

  <section id="tab-contact" hidden>
    <h2 class="sec">Контакты и ссылки</h2>
    <div class="links" id="links-list"></div>
  </section>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> <span id="f-name"></span> · канал на YouTube</div>
</footer>

<div id="draft-banner" hidden>
  <span>Черновик не опубликован: сайт показывает версию из репозитория.</span>
  <button id="btn-show-draft">Показать черновик</button>
  <button id="btn-del-draft" class="ghost">Убрать черновик</button>
</div>

<button id="admin-btn" title="Админ-панель" onclick="location.href='admin.html'">⚙</button>

<script>
'use strict';
var DRAFT_KEY = 'dw_draft_config';
var FALLBACK_CFG = {"channel":{"name":"Deadly_wolf","handle":"@Deadly00wolf","channelId":"UCN3_YEiDPE_tUzS0vkQoYYg","url":"https://www.youtube.com/@Deadly00wolf","avatar":"https://unavatar.io/youtube/Deadly00wolf","tagline":"Прохождения, геймплей и просто играем"},"hero":{"title":"DEADLY_WOLF","subtitle":"Игровые прохождения без пафоса: стреляю, застреваю и помираю.","cta":"Смотреть последние видео"},"about":"Привет! Это канал Deadly_wolf. Здесь я выкладываю прохождения игр: Titanfall 2, Euro Truck Simulator 2, Lethal Company, Half-Life 2 и не только.","links":[{"type":"youtube","title":"YouTube","url":"https://www.youtube.com/@Deadly00wolf"}],"theme":{"accent":"#660000","accent2":"#320b35"}};

var ICONS = {
  youtube:'<svg viewBox="0 0 24 24"><path d="M23 7.5s-.2-1.6-.9-2.3c-.9-.9-1.9-.9-2.4-1C16.6 4 12 4 12 4s-4.6 0-7.7.2c-.5.1-1.5.1-2.4 1C1.2 5.9 1 7.5 1 7.5S.8 9.4.8 11.3v1.7c0 1.9.2 3.8.2 3.8s.2 1.6.9 2.3c.9.9 2 .9 2.5 1 1.8.2 7.6.2 7.6.2s4.6 0 7.7-.2c.5-.1 1.5-.1 2.4-1 .7-.7.9-2.3.9-2.3s.2-1.9.2-3.8v-1.7c0-1.9-.2-3.8-.2-3.8zM9.8 15.1V8.6l6.2 3.3-6.2 3.2z"/></svg>',
  telegram:'<svg viewBox="0 0 24 24"><path d="M21.9 4.4 2.7 11.8c-1 .4-1 1.8 0 2.1l4.8 1.6 1.8 5.5c.3.9 1.4 1.1 2 .4l2.6-2.6 4.9 3.6c.7.5 1.7.1 1.9-.7l3-16c.2-1-.8-1.7-1.8-1.3zM8.5 14.9l9.3-6.6c.3-.2.6.2.4.4l-7.6 7.2-.3 3.1-1.8-4.1z"/></svg>',
  vk:'<svg viewBox="0 0 24 24"><path d="M12.8 18.4c-6 0-9.5-4.2-9.6-11h3c.1 5 2.3 7.1 4 7.5V7.4h2.9v4.3c1.7-.2 3.5-2.2 4.1-4.3h2.8c-.5 2.6-2.4 4.6-3.8 5.4 1.4.7 3.5 2.4 4.3 5.6h-3.1c-.6-2-2.2-3.6-4.3-3.8v3.8h-.3z"/></svg>',
  discord:'<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.9 3l-.6 1.2a16 16 0 0 0-6.6 0L8.1 3a19.7 19.7 0 0 0-4.4 1.4C.9 8.6.2 12.7.6 16.7a20 20 0 0 0 5.9 3l1.3-2a12 12 0 0 1-2-1l.5-.4a13.9 13.9 0 0 0 11.4 0l.5.4a12 12 0 0 1-2 1l1.3 2a20 20 0 0 0 5.9-3c.5-4.6-.7-8.6-3.1-12.3zM8.7 14.2c-1.1 0-2-1-2-2.3s.9-2.3 2-2.3 2 1 2 2.3-.9 2.3-2 2.3zm6.6 0c-1.1 0-2-1-2-2.3s.9-2.3 2-2.3 2 1 2 2.3-.9 2.3-2 2.3z"/></svg>',
  twitch:'<svg viewBox="0 0 24 24"><path d="M4.3 2 2.5 5.7v14h4.7V22h2.6l2.4-2.4h3.6L21.5 14V2H4.3zm15.4 11.2-3 3h-4.7l-2.4 2.4v-2.4H5.9V3.7h13.8v9.5zM16.5 7v5.1h-1.8V7h1.8zm-4.7 0v5.1H10V7h1.8z"/></svg>',
  steam:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-10 9.4l5.4 2.2a2.8 2.8 0 0 1 1.6-.5l2.4-3.5v-.1a3.8 3.8 0 1 1 3.8 3.8h-.1l-3.4 2.5a2.8 2.8 0 0 1-5.5.7L2.3 14.6A10 10 0 1 0 12 2zm-5.5 14.7.1.1-1.2-.5 1.1.4zm5-9a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm0 .5a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>'
};

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function fmtDate(s){if(!s)return '';var d=new Date(s);return isNaN(d)?'':d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}
function iconFor(type,name){
  if(ICONS[type])return ICONS[type];
  return '<svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="14" font-family="Rajdhani" fill="currentColor">'+esc((name||type||'?').charAt(0).toUpperCase())+'</text></svg>';
}

var PUBLISHED = null, SHOWING_DRAFT = false;

function render(cfg){
  var ch = cfg.channel||{}, hero = cfg.hero||{}, theme = cfg.theme||{};
  document.documentElement.style.setProperty('--accent', theme.accent||'#660000');
  document.documentElement.style.setProperty('--accent2', theme.accent2||'#320b35');
  document.title = ch.name||'Канал';
  document.getElementById('ch-name').textContent = ch.name||'';
  document.getElementById('ch-tagline').textContent = ch.tagline||'';
  document.getElementById('f-name').textContent = ch.name||'';
  document.getElementById('year').textContent = new Date().getFullYear();
  document.getElementById('avatar').src = ch.avatar||'';
  document.getElementById('hero-title').textContent = hero.title||'';
  document.getElementById('hero-subtitle').textContent = hero.subtitle||'';
  document.getElementById('hero-cta').textContent = hero.cta||'Смотреть видео';
  document.getElementById('about-text').textContent = cfg.about||'';
  var ll = document.getElementById('links-list');
  ll.innerHTML = '';
  (cfg.links||[]).forEach(function(l){
    var a = document.createElement('a');
    a.className='link-card'; a.href=l.url||'#'; a.target='_blank'; a.rel='noopener';
    a.innerHTML = iconFor(l.type,l.title)+'<span>'+esc(l.title||l.url||'')+'</span>';
    ll.appendChild(a);
  });
}

function vcard(v,big){
  if(big){
    return '<a class="fresh-card" href="'+esc(v.url)+'" target="_blank" rel="noopener">'+
      '<img src="'+esc(v.thumbnail)+'" alt="" loading="lazy">'+
      '<span class="fresh-info"><span class="vtitle">'+esc(v.title)+'</span>'+
      '<span class="vdate">'+fmtDate(v.published)+'</span>'+
      '<span class="badge">Смотреть на YouTube</span></span></a>';
  }
  return '<a class="vcard" href="'+esc(v.url)+'" target="_blank" rel="noopener">'+
    '<img src="'+esc(v.thumbnail)+'" alt="" loading="lazy">'+
    '<span class="vt">'+esc(v.title)+'</span><span class="vd">'+fmtDate(v.published)+'</span></a>';
}

function showStatus(msg){var s=document.getElementById('videos-status');s.textContent=msg;s.hidden=false;}

function renderVideos(videos){
  var grid=document.getElementById('videos-grid'), fresh=document.getElementById('fresh-slot');
  if(!videos||!videos.length){
    document.getElementById('fresh-slot').innerHTML='';
    showStatus('Лента временно недоступна. Смотрите видео прямо на канале: '+(PUBLISHED&&PUBLISHED.channel?PUBLISHED.channel.url:''));
    return;
  }
  document.getElementById('videos-status').hidden=true;
  fresh.innerHTML=vcard(videos[0],true);
  grid.innerHTML=videos.slice(1,10).map(function(v){return vcard(v,false);}).join('');
}

function fetchWithTimeout(url,ms){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error('timeout'));},ms||10000);
    fetch(url).then(function(r){clearTimeout(t);res(r);},function(e){clearTimeout(t);rej(e);});
  });
}

async function loadFeed(channelId){
  // 1) локальный кэш, который обновляет GitHub Actions
  try{
    var r=await fetchWithTimeout('videos.json?cb='+Date.now(),8000);
    if(r.ok){var j=await r.json();if(j&&j.videos&&j.videos.length)return j.videos;}
  }catch(e){}
  var rss='https://www.youtube.com/feeds/videos.xml?channel_id='+channelId;
  // 2) rss2json
  try{
    var r2=await fetchWithTimeout('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss),9000);
    if(r2.ok){var j2=await r2.json();
      if(j2&&j2.items&&j2.items.length)return j2.items.map(function(it){
        return {id:(it.guid||'').replace(/^yt:video:/,''),title:it.title,published:it.pubDate,
          url:it.link||it.url,thumbnail:it.thumbnail||((it.enclosure&&it.enclosure.link)||''),
          description:it.description||''};
      }).filter(function(v){return v.id;});}
  }catch(e){}
  // 3) allorigins
  try{
    var r3=await fetchWithTimeout('https://api.allorigins.win/raw?url='+encodeURIComponent(rss),9000);
    if(r3.ok){var txt=await r3.text();return parseRss(txt);}
  }catch(e){}
  // 4) corsproxy
  try{
    var r4=await fetchWithTimeout('https://corsproxy.io/?url='+encodeURIComponent(rss),9000);
    if(r4.ok){var txt4=await r4.text();return parseRss(txt4);}
  }catch(e){}
  return [];
}

function parseRss(xmlText){
  try{
    var doc=new DOMParser().parseFromString(xmlText,'text/xml');
    var out=[],entries=doc.getElementsByTagName('entry');
    for(var i=0;i<entries.length;i++){
      var e=entries[i],get=function(t){var el=e.getElementsByTagName(t)[0];return el?el.textContent:'';};
      var vid=get('videoId')||get('yt:videoId');
      if(!vid)continue;
      var thumb=get('thumbnail')||get('media:thumbnail');
      out.push({id:vid,title:get('title'),published:get('published'),
        url:'https://www.youtube.com/watch?v='+vid,
        thumbnail:thumb||('https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg'),description:get('description')});
    }
    return out;
  }catch(e){return [];}
}

function switchTab(name){
  ['home','videos','about','contact'].forEach(function(t){
    document.getElementById('tab-'+t).hidden=(t!==name);
  });
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('active',b.dataset.tab===name);
  });
  window.scrollTo({top:0});
}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){switchTab(b.dataset.tab);});});

async function boot(cfg){
  PUBLISHED = cfg;
  render(cfg);
  var vids = await loadFeed(cfg.channel.channelId);
  renderVideos(vids);
}

function checkDraft(){
  var raw=null;
  try{raw=localStorage.getItem(DRAFT_KEY);}catch(e){}
  var banner=document.getElementById('draft-banner');
  if(!raw){banner.hidden=true;return;}
  banner.hidden=false;
  document.getElementById('btn-show-draft').onclick=function(){
    try{SHOWING_DRAFT=true;render(JSON.parse(raw));}catch(e){}
    banner.hidden=true;
  };
  document.getElementById('btn-del-draft').onclick=function(){
    try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
    banner.hidden=true;
    if(SHOWING_DRAFT&&PUBLISHED){SHOWING_DRAFT=false;render(PUBLISHED);}
  };
}

(async function(){
  var cfg=FALLBACK_CFG;
  try{
    var r=await fetchWithTimeout('config.json?cb='+Date.now(),8000);
    if(r.ok)cfg=await r.json();
  }catch(e){}
  checkDraft();
  boot(cfg);
})();
</script>
</body>
</html>
