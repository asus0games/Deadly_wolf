<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadly_wolf — официальный сайт канала</title>
<style>
:root{--accent:#8b5cf6;--accent2:#e11d48;--bg:#0b0d14;--panel:#141828;--line:#23283c;--text:#e8eaf2;--muted:#9aa3b5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.55}
.hero{position:relative;padding:60px 20px 44px;text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--accent),var(--accent2));opacity:.16;pointer-events:none}
.logo{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.handle{color:var(--muted);font-size:1.05rem;position:relative;margin-top:6px}
.tagline{max-width:640px;margin:14px auto 0;color:var(--text);opacity:.85;position:relative}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;position:relative}
nav button{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 24px;border-radius:999px;cursor:pointer;font-size:1rem;transition:.2s}
nav button:hover{border-color:var(--accent)}
nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:32px 20px 64px}
.tab{display:none}.tab.active{display:block}
h2{margin-bottom:18px;font-size:1.5rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.muted{color:var(--muted)}
.banner{background:#33290f;border:1px solid #8a6d1f;color:#f3d98a;border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:.95rem}
.embed{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:block;transition:.2s}
.vcard:hover{border-color:var(--accent);transform:translateY(-3px)}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.vcard .t{padding:12px 14px 4px;font-weight:600;font-size:.95rem}
.vcard .d{padding:0 14px 14px;color:var(--muted);font-size:.85rem}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:13px 26px;border-radius:12px;text-decoration:none;font-weight:600;border:0;cursor:pointer;font-size:1rem}
.btn.ghost{background:var(--panel);border:1px solid var(--line);font-weight:400}
.linkcard{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px;text-decoration:none;transition:.2s}
.linkcard:hover{border-color:var(--accent)}
.sub{display:flex;justify-content:center;margin-top:22px}
footer{text-align:center;color:var(--muted);padding:26px 20px;border-top:1px solid var(--line);font-size:.9rem}
</style>
</head>
<body>
<header class="hero">
  <div class="logo" id="ch-name">Deadly_wolf</div>
  <div class="handle" id="ch-handle">@Deadly00wolf</div>
  <p class="tagline" id="ch-tagline"></p>
  <nav>
    <button class="active" data-tab="home">Главная</button>
    <button data-tab="videos">Видео</button>
    <button data-tab="about">О канале</button>
    <button data-tab="contacts">Контакты</button>
  </nav>
</header>
<main>
  <section class="tab active" id="tab-home">
    <h2>Последнее видео</h2>
    <div class="embed" id="latest-embed"><div class="card muted">Загружаю последнее видео…</div></div>
    <div class="sub"><a class="btn" id="sub-btn" href="#" target="_blank" rel="noopener">Подписаться на канал</a></div>
  </section>
  <section class="tab" id="tab-videos">
    <h2>Все видео</h2>
    <div class="vidgrid" id="vid-grid"><div class="card muted">Загружаю видео…</div></div>
  </section>
  <section class="tab" id="tab-about">
    <h2>О канале</h2>
    <div class="card" id="about-text"></div>
  </section>
  <section class="tab" id="tab-contacts">
    <h2>Контакты и соцсети</h2>
    <div id="links-list"></div>
  </section>
</main>
<footer id="footer-line">Сайт канала Deadly_wolf</footer>
<div id="draft-banner"></div>
<script>
const DRAFT_KEY = "dw_config_draft_v1";
const FALLBACK = {
  channel: { name: "Deadly_wolf", handle: "@Deadly00wolf",
    url: "https://www.youtube.com/channel/UCN3_YEiDPE_tUzS0vkQoYYg",
    tagline: "Прохождения игр без воды и лишних слов" },
  about: "Привет! Я Deadly_wolf — на этом канале я выкладываю прохождения игр.",
  links: [{ title: "YouTube", url: "https://www.youtube.com/channel/UCN3_YEiDPE_tUzS0vkQoYYg" }],
  colors: { accent: "#8b5cf6", accent2: "#e11d48" },
  channelId: "UCN3_YEiDPE_tUzS0vkQoYYg"
};
let CFG = FALLBACK;

function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function applyConfig(c){
  CFG = c || CFG;
  const ch = CFG.channel || {};
  document.title = (ch.name || "Канал") + " — сайт канала";
  document.getElementById("ch-name").textContent = ch.name || "Канал";
  document.getElementById("ch-handle").textContent = ch.handle || "";
  document.getElementById("ch-tagline").textContent = ch.tagline || "";
  document.getElementById("about-text").textContent = CFG.about || "";
  document.getElementById("sub-btn").href = ch.url || "#";
  document.getElementById("footer-line").textContent = "Сайт канала " + (ch.name || "");
  const col = CFG.colors || {};
  if (col.accent) document.documentElement.style.setProperty("--accent", col.accent);
  if (col.accent2) document.documentElement.style.setProperty("--accent2", col.accent2);
  const box = document.getElementById("links-list");
  box.innerHTML = "";
  (CFG.links || []).forEach(l => {
    if (!l || !l.url) return;
    const a = document.createElement("a");
    a.className = "linkcard"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = "<span><b>" + esc(l.title || l.url) + "</b></span><span class='muted'>" + esc(l.url) + "</span>";
    box.appendChild(a);
  });
}
function showDraftBanner(show){
  document.getElementById("draft-banner").innerHTML = show
    ? "<div class='banner' style='max-width:1100px;margin:0 auto 8px;padding:10px 16px'>Сейчас показан черновик из админ-панели — он виден только в вашем браузере. Нажмите «Скачать config.json» в админке и загрузите файл в репозиторий, чтобы опубликовать изменения.</div>"
    : "";
  document.querySelector(".hero").style.paddingTop = show ? "36px" : "60px";
}
async function loadConfig(){
  let fromSite = null;
  try {
    const r = await fetch("config.json", { cache: "no-store" });
    if (r.ok) fromSite = await r.json();
  } catch(e){}
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch(e){}
  if (draft) { CFG = draft; applyConfig(CFG); showDraftBanner(true); }
  else if (fromSite) { CFG = fromSite; applyConfig(CFG); showDraftBanner(false); }
  else { applyConfig(FALLBACK); }
}
/* ---------- видео по RSS ---------- */
const FEED = "https://www.youtube.com/feeds/videos.xml?channel_id=" + encodeURIComponent(CFG.channelId || "");
function renderVideos(items){
  const grid = document.getElementById("vid-grid");
  const emb = document.getElementById("latest-embed");
  if (!items.length){ grid.innerHTML = "<div class='card muted'>Не удалось загрузить видео. Проверьте интернет и обновите страницу.</div>"; return; }
  grid.innerHTML = "";
  items.forEach((v, i) => {
    const id = v.id || "";
    const a = document.createElement("a");
    a.className = "vcard";
    a.href = "https://www.youtube.com/watch?v=" + id; a.target = "_blank"; a.rel = "noopener";
    const date = v.date ? new Date(v.date).toLocaleDateString("ru-RU") : "";
    a.innerHTML = "<img loading='lazy' src='" + esc(v.thumb) + "' alt=''><div class='t'>" + esc(v.title) + "</div><div class='d'>" + esc(date) + "</div>";
    grid.appendChild(a);
    if (i === 0){
      emb.innerHTML = "<iframe src='https://www.youtube-nocookie.com/embed/" + id + "' title='Последнее видео' allowfullscreen loading='lazy'></iframe>";
    }
  });
}
async function loadVideos(){
  const xmlUrl = "https://www.youtube.com/feeds/videos.xml?channel_id=" + encodeURIComponent(CFG.channelId || "");
  try {
    const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(xmlUrl));
    if (r.ok){
      const d = await r.json();
      if (d.items && d.items.length){
        renderVideos(d.items.map(it => ({
          id: it.guid ? String(it.guid).split("=").pop() : (it.link || "").split("v=")[1],
          title: it.title, thumb: it.thumbnail || (it.enclosure && it.enclosure.link) || "", date: it.pubDate
        })));
        return;
      }
    }
  } catch(e){}
  try {
    const r2 = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(xmlUrl));
    if (r2.ok){
      const xml = new DOMParser().parseFromString(await r2.text(), "text/xml");
      const items = [];
      xml.querySelectorAll("entry").forEach(en => {
        const get = s => (en.querySelector(s) || {}).textContent || "";
        items.push({
          id: get("yt\\:videoId") || get("videoId"),
          title: get("title"),
          thumb: (en.querySelector("media\\:thumbnail, thumbnail") || {}).getAttribute ? (en.querySelector("media\\:thumbnail, thumbnail").getAttribute("url") || "") : "",
          date: get("published")
        });
      });
      renderVideos(items);
      return;
    }
  } catch(e){}
  renderVideos([]);
}
/* ---------- вкладки ---------- */
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById("tab-" + b.dataset.tab).classList.add("active");
}));
loadConfig().then(loadVideos);
</script>
</body>
</html>
